<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인수인계 자가진단 · 디테일랩</title>
<meta name="description" content="교대할 때 놓치는 칸을 12문으로 확인합니다. 인사평가 도구가 아닙니다.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://detail-lab-site.onrender.com/guide-self-check.html">
<meta property="og:type" content="website">
<meta property="og:title" content="인수인계 자가진단 · 디테일랩">
<meta property="og:description" content="교대할 때 놓치는 칸을 12문으로 확인합니다. 인사평가 도구가 아닙니다.">
<meta property="og:image" content="og-owner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="인수인계 자가진단 · 디테일랩">
<meta name="twitter:image" content="og-owner.png">
<style>
  :root{
    --bg: #12141A;
    --panel: #1A1D24;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #ECEDEF;
    --ink-dim: #9AA3AF;
    --ink-faint: #5C6570;
    --accent: #D9622B;
    --accent-ink: #1C0D06;
    --accent-soft: rgba(217,98,43,0.14);
    --danger: #E4572E;
    --danger-soft: rgba(228,87,46,0.16);
    --caution: #E3A008;
    --caution-soft: rgba(227,160,8,0.16);
    --stable: #3FA34D;
    --stable-soft: rgba(63,163,77,0.16);
    --radius: 14px;
    --maxw: 560px;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 20px 60px; }
  .brandline{ width:100%; max-width:var(--maxw); display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--ink-faint); margin-bottom:28px; }
  .brandline .mark{ color: var(--ink-dim); font-weight:600; }
  .screen{ width:100%; max-width:var(--maxw); }

  .intro h1{ font-size:29px; line-height:1.32; font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; }
  .intro p.lead{ font-size:15px; line-height:1.6; color:var(--ink-dim); margin:0 0 28px; }
  .facts{ display:flex; gap:10px; margin-bottom:32px; flex-wrap:wrap; }
  .fact{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--ink-dim); }
  .fact b{ color:var(--ink); font-weight:700; }
  .cat-preview{ display:flex; flex-direction:column; gap:8px; margin-bottom:32px; }
  .cat-preview-item{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink-dim); }
  .cat-preview-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  button.primary{ width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px; padding:16px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .12s ease; }
  button.primary:active{ transform:scale(0.98); }
  .fineprint{ font-size:12px; color:var(--ink-faint); text-align:center; margin-top:14px; line-height:1.5; }

  .progress-wrap{ display:flex; gap:5px; margin-bottom:28px; }
  .progress-dot{ flex:1; height:4px; border-radius:2px; background:var(--panel-border); }
  .progress-dot.done{ background:var(--accent); }
  .progress-dot.current{ background:var(--ink-faint); }
  .q-meta{ font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:10px; }
  .q-text{ font-size:21px; line-height:1.45; font-weight:700; margin:0 0 24px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option-btn{ text-align:left; background:var(--panel); border:1px solid var(--panel-border); color:var(--ink); border-radius:var(--radius); padding:16px; font-size:14.5px; line-height:1.5; cursor:pointer; transition:border-color .12s ease, background .12s ease; }
  .option-btn:hover{ border-color: rgba(217,98,43,0.5); }
  .option-btn:active{ background: var(--accent-soft); }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
  .back-link{ color:var(--ink-faint); font-size:13px; cursor:pointer; background:none; border:none; padding:8px 0; }
  .back-link:hover{ color:var(--ink-dim); }

  .result-band{ display:inline-block; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:100px; margin-bottom:14px; }
  .band-stable{ background:var(--stable-soft); color:var(--stable); }
  .band-caution{ background:var(--caution-soft); color:var(--caution); }
  .band-danger{ background:var(--danger-soft); color:var(--danger); }
  .score-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .score-num{ font-size:52px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; }
  .score-suffix{ font-size:16px; color:var(--ink-dim); }
  .result-headline{ font-size:16px; line-height:1.6; color:var(--ink-dim); margin:0 0 28px; }

  .cat-block{ margin-bottom:28px; }
  .cat-block h3{ font-size:13px; font-weight:700; color:var(--ink-faint); margin:0 0 12px; }
  .cat-item{ margin-bottom:14px; }
  .cat-item-top{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .cat-item-top .name{ color:var(--ink); font-weight:600; }
  .cat-item-top .pct{ color:var(--ink-dim); font-variant-numeric: tabular-nums; }
  .cat-bar-track{ height:8px; background:var(--panel); border:1px solid var(--panel-border); border-radius:5px; overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:5px; }

  .insight-box{ background:var(--panel); border:1px solid var(--panel-border); border-left:3px solid var(--danger); border-radius:10px; padding:16px 18px; font-size:14px; line-height:1.65; color:var(--ink-dim); margin-bottom:20px; }
  .insight-box .cat-name{ color:var(--danger); font-weight:700; }

  .manual-box{ background:var(--panel); border:1px solid var(--panel-border); border-left:3px solid var(--accent); border-radius:10px; padding:18px; margin-bottom:28px; }
  .manual-box h4{ margin:0 0 10px; font-size:14px; color:var(--ink); }
  .manual-box ul{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.8; color:var(--ink-dim); }

  .compare-box{ background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:18px; margin-bottom:28px; font-size:13.5px; color:var(--ink-dim); line-height:1.6; }
  .compare-box b{ color:var(--ink); }

  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  button.secondary{ width:100%; background:transparent; color:var(--ink-dim); border:1px solid var(--panel-border); border-radius:12px; padding:14px; font-size:14.5px; font-weight:600; cursor:pointer; }
  button.secondary:hover{ border-color:var(--ink-faint); color:var(--ink); }
  a.cta-link{ text-decoration:none; display:block; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--panel-border); color:var(--ink); padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .toast.show{ opacity:1; }

  @media (max-width:420px){ .intro h1{ font-size:24px; } .q-text{ font-size:19px; } .score-num{ font-size:44px; } }
</style>
</head>
<body>
<main id="main">
<div class="app">
  <div class="brandline"><span class="mark">디테일랩</span><span>인수인계 · 인사평가 아님</span></div>
  <div class="screen" id="screen"></div>
</div>
</main>
<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ["넘긴 방식","빈칸","예외"];

const QUESTIONS = [
  { cat:0, text:"최근 7일, 교대 인수인계가 구두로만 이뤄진 횟수는?", options:[
    {t:"0~1회, 대부분 한 장이 있었다", s:3},
    {t:"2~3회", s:2},
    {t:"4~5회", s:1},
    {t:"거의 매번 말로만 넘겼다", s:0},
  ]},
  { cat:0, text:"다음 근무자가 확인해야 할 항목이 문서로 있나요?", options:[
    {t:"있고 다음 사람이 그 칸을 본다", s:3},
    {t:"대략 있지만 비는 칸이 있다", s:2},
    {t:"단톡·머릿속에만 있다", s:1},
    {t:"없다", s:0},
  ]},
  { cat:0, text:"교대 5분 전에 한 장을 채우나요?", options:[
    {t:"매 교대 채운다", s:3},
    {t:"바쁠 때는 건너뛴다", s:2},
    {t:"거의 안 채운다", s:1},
    {t:"그런 한 장이 없다", s:0},
  ]},
  { cat:0, text:"다음 사람이 회원 앞에서 그 한 장을 읽고 움직이나요?", options:[
    {t:"읽고 바로 안내한다", s:3},
    {t:"반은 되고 반은 다시 묻는다", s:2},
    {t:"기록은 있는데 행동이 없다", s:1},
    {t:"회원 앞에서 처음부터 다시 묻는다", s:0},
  ]},
  { cat:1, text:"최근 4주, 인수인계 누락으로 재작업·재확인이 발생한 횟수는?", options:[
    {t:"0~1회", s:3},
    {t:"2~3회", s:2},
    {t:"주 1회 이상", s:1},
    {t:"거의 매일 같은 일을 다시 한다", s:0},
  ]},
  { cat:1, text:"메모가 “처리 중”으로만 남은 비율은?", options:[
    {t:"거의 없다. 다음 행동이 적혀 있다", s:3},
    {t:"가끔 처리 중으로 끝난다", s:2},
    {t:"절반 이상이 처리 중이다", s:1},
    {t:"대부분 처리 중으로 퇴근한다", s:0},
  ]},
  { cat:1, text:"지금 해도 되는 다음 행동이 적힌 비율은?", options:[
    {t:"대부분 적혀 있다", s:3},
    {t:"절반 정도", s:2},
    {t:"거의 없다", s:1},
    {t:"없다", s:0},
  ]},
  { cat:1, text:"다시 확인하는 시점이 적힌 비율은?", options:[
    {t:"대부분 시점이 있다", s:3},
    {t:"절반 정도", s:2},
    {t:"거의 없다", s:1},
    {t:"없다", s:0},
  ]},
  { cat:1, text:"최근 7일, 같은 회원이 같은 질문을 두 번 한 횟수는?", options:[
    {t:"없었다", s:3},
    {t:"1번", s:2},
    {t:"2~3번", s:1},
    {t:"여러 번, 교대마다 반복됐다", s:0},
  ]},
  { cat:1, text:"기구·시설이 “나중에 보기”로만 넘어가고, 사용 중지 범위가 없었던 횟수(4주)는?", options:[
    {t:"없었다", s:3},
    {t:"1번", s:2},
    {t:"2~3번", s:1},
    {t:"반복됐다", s:0},
  ]},
  { cat:2, text:"최근 4주, 적혀 있지 않은 예외를 근무자가 새로 연 횟수는?", options:[
    {t:"없었다", s:3},
    {t:"1번", s:2},
    {t:"여러 번", s:1},
    {t:"친절한 사람이 조건을 자주 새로 연다", s:0},
  ]},
  { cat:2, text:"담당자가 출근한 뒤, 밤에 열린 예외를 닫는지 확인하나요?", options:[
    {t:"확인하고 표시한다", s:3},
    {t:"가끔 한다", s:2},
    {t:"거의 안 한다", s:1},
    {t:"예외가 열린 줄도 모른다", s:0},
  ]},
];

const MANUALS = [
  { h:"교대 때 전달하는 방식", items:[
    "최근 다시 물어본 인수인계 한 건을 고르세요.",
    "넘긴 사람은 요청 내용과 다음 담당자를, 받는 사람은 확인 시각을 적으세요.",
    "7일 뒤 같은 건을 다시 물은 횟수를 세어 보세요.",
  ]},
  { h:"다음 행동과 확인 시점", items:[
    "메모에 '처리 중'이라고 남은 한 건을 찾으세요.",
    "다음에 할 일·담당자·확인 시각을 한 줄로 적으세요.",
    "7일 뒤 완료 표시 없이 남은 건수를 확인하세요.",
  ]},
  { h:"예외를 남기는 방식", items:[
    "최근 임시로 안내한 예외 한 건을 고르세요.",
    "누가 승인했고 다음 담당자가 무엇을 확인해야 하는지 적으세요.",
    "7일 뒤 예외가 전달되지 않아 다시 생긴 문의를 세어 보세요.",
  ]},
];

const state = { idx:0, answers:new Array(QUESTIONS.length).fill(null), texts:new Array(QUESTIONS.length).fill('') };
const screen = document.getElementById('screen');
const toastEl = document.getElementById('toast');

function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 1800); }

function renderIntro(){
  screen.innerHTML = `
    <div class="intro">
      <h1>교대 뒤에도 일이 이어지고 있나요?</h1>
      <p class="lead">최근 교대 장면을 떠올리며 12문에 답하세요. 어떤 전달 내용을 먼저 확인하면 좋을지 고르고 7일간 써볼 카드를 드립니다. 약 5분, 무료입니다.</p>
      <div class="facts">
        <div class="fact"><b>12</b> 문항</div>
        <div class="fact"><b>저장</b> 안 함</div>
        <div class="fact"><b>7일</b> 확인 카드</div>
      </div>
      <div class="cat-preview">
        ${CATEGORIES.map(c=>`<div class="cat-preview-item"><span class="dot"></span>${c}</div>`).join('')}
      </div>
      <button class="primary" onclick="startQuiz()">인수인계 점검 시작</button>
      <p class="fineprint">답변은 서버에 저장되지 않습니다. 직원을 평가하거나 법적 책임을 판단하는 도구는 아닙니다.</p>
    </div>
  `;
}

function startQuiz(){ state.idx = 0; renderQuestion(); }

function renderProgress(){
  return `<div class="progress-wrap">${QUESTIONS.map((_,i)=>{
    let cls='progress-dot'; if(i<state.idx) cls+=' done'; else if(i===state.idx) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx+1} / ${QUESTIONS.length} · ${CATEGORIES[q.cat]}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">${q.options.map((o,oi)=>`<button class="option-btn" onclick="answer(${oi})">${o.t}</button>`).join('')}</div>
    <div class="nav-row">${state.idx>0?`<button class="back-link" onclick="goBack()">← 이전 질문</button>`:`<span></span>`}</div>
  `;
}

function answer(oi){
  const q = QUESTIONS[state.idx];
  state.answers[state.idx] = q.options[oi].s;
  state.texts[state.idx] = q.options[oi].t;
  if(state.idx < QUESTIONS.length-1){ state.idx+=1; renderQuestion(); }
  else{ renderResult(); }
}

function goBack(){ if(state.idx>0){ state.idx-=1; renderQuestion(); } }

function renderResult(){
  const rows = QUESTIONS.map((q,i)=>`<div class="cat-item"><div class="cat-item-top"><span class="name">${q.text}</span></div><p style="margin:0;color:var(--ink-dim);font-size:13.5px;line-height:1.5">${state.texts[i]||''}</p></div>`).join('');
  const totals=CATEGORIES.map((_,cat)=>QUESTIONS.reduce((sum,q,i)=>sum+(q.cat===cat?state.answers[i]:0),0));
  const focus=totals.indexOf(Math.min(...totals));
  const card=MANUALS[focus];
  screen.innerHTML = `
    <div class="result">
      <div class="result-band band-caution">내 답변으로 만든 7일 확인 카드</div>
      <p class="result-headline">이번 답변에서 먼저 확인할 주제는 <strong>${CATEGORIES[focus]}</strong>입니다. 답변을 정리한 순서이며 실제 원인이나 직원의 책임을 판정한 것은 아닙니다.</p>
      <div class="manual-box"><h4>7일 동안 해볼 일 · ${card.h}</h4><ul>${card.items.map(item=>`<li>${item}</li>`).join('')}</ul></div>
      <div class="cat-block"><h3>내가 고른 12개 답</h3>${rows}</div>
      <div class="result-actions">
        <button class="primary" onclick="copyResult()">7일 카드와 답변 복사하기</button>
        <button class="secondary" onclick="renderIntro()">처음부터 다시 하기</button>
      </div>
    </div>
  `;
}

function copyResult(){
  const totals=CATEGORIES.map((_,cat)=>QUESTIONS.reduce((sum,q,i)=>sum+(q.cat===cat?state.answers[i]:0),0));
  const card=MANUALS[totals.indexOf(Math.min(...totals))];
  const lines = ['[디테일랩 · 인수인계 확인]','',`7일 동안 해볼 일: ${card.h}`,...card.items.map((item,i)=>`${i+1}. ${item}`),'',...QUESTIONS.map((q,i)=>`${q.text}\n→ ${state.texts[i]||''}`)];
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('결과가 복사되었습니다'));
  }else{ showToast('복사를 지원하지 않는 환경입니다'); }
}

renderIntro();
</script>
</body>
</html>
