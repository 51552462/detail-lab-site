    --bg-soft: #101828;
    --panel: #121a29;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #ECEDEF;

    --ink-faint: #8A94A3;

  }

    max-width: var(--maxw);
    display:flex;
    align-items:center;

    color: var(--ink-faint);
    margin-bottom: 28px;
  }
  .brandline .mark{
    color: var(--ink-dim);
    font-weight: 600;
  }

    max-width: var(--maxw);

    font-size: 30px;
    line-height: 1.32;
    font-weight: 800;

  .intro p.lead{
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  .facts{
    display:flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .fact{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-dim);

  .fact b{ color: var(--ink); font-weight: 700; }

    display:flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .cat-preview-item{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-dim);
  }
  .cat-preview-item .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

    width: 100%;
    background: var(--accent);
    color: #04122b;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button.primary:active{ transform: scale(0.98); }

  .fineprint{
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }

  /* ---------- Quiz ---------- */

    display:flex;
    gap: 5px;
    margin-bottom: 28px;
  }
  .progress-dot{
    flex: 1;
    height: 4px;

  }
  .progress-dot.done{ background: var(--accent); }
  .progress-dot.current{ background: var(--ink-faint); }

  .q-meta{

    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;

  .q-text{

    line-height: 1.45;
    font-weight: 700;

    gap: 10px;
    margin-bottom: 6px;

  .score-num{
    font-size: 52px;
    font-weight: 800;

  .score-suffix{

  .result-headline{
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-dim);

    padding: 18px;
    margin-bottom: 28px;
    font-size: 13.5px;
    color: var(--ink-dim);

  .compare-box b{ color: var(--ink); }
  .compare-box a{ color: var(--accent); font-weight: 700; text-underline-offset: 3px; }

  .result-actions{
    display:flex;
    flex-direction: column;
    gap: 10px;

  .feedback-link{display:block;padding:10px;text-align:center;color:var(--accent);font-size:13px;font-weight:700;text-underline-offset:4px}
  button.secondary{
    width: 100%;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary:hover{ border-color: var(--ink-faint); color: var(--ink); }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show{ opacity: 1; }

  @media (max-width: 420px){
    .intro h1{ font-size: 25px; }
    .q-text{ font-size: 19px; }
    .score-num{ font-size: 44px; }

  .fineprint a{ color:var(--ink-dim); text-underline-offset:3px; }
  .fineprint a:hover{ color:var(--ink); }
  .brandline a.mark{ text-decoration:none; }
  .brandline a.mark:hover{ color:var(--ink); }
  .home-link{ display:block; padding:10px; text-align:center; color:var(--ink-dim); font-size:13px; text-underline-offset:4px; }
  [tabindex="-1"]:focus{ outline:none; }
  @media print{
    html,body{ background:#fff; color:#111; }
    .app{ padding:0; min-height:auto; }
    .brandline,.result-actions,.toast,.progress-wrap,.nav-row{ display:none !important; }
    .screen{ max-width:none; }
    .result-headline,.manual-box h4,.manual-box li,.after-seven,.after-seven strong,.compare-box,.compare-box b,.compare-box strong,.compare-box a,.insight-box,.insight-box li,.cat-block h3,.cat-item .name,.cat-item p,.record-box,.record-box h3,.record-box p,.record-box label{ color:#111 !important; }
    .manual-box,.compare-box,.record-box,.insight-box{ background:#fff; border:1px solid #888; break-inside:avoid; }
    .record-box input{ background:#fff; color:#111; border:1px solid #888; }
    .result-band{ background:#fff; color:#111; border:1px solid #888; }
  }
</style>

  [
    "담당 회원이 다른 트레이너나 센터로 옮겨 갈 때 정해진 절차가 있나요? 담당 트레이너에게는 언제 알려 주나요?",
    "환불이나 컴플레인이 생기면 누가 사실관계를 확인하고, 트레이너에게는 어떻게 공유하나요?",
    "그 과정에서 트레이너의 의견은 어디에 기록되나요?"
  ],
  [
    "입사 후 첫 주에는 누가 어떤 내용을 알려 주나요?",
    "교육이나 피드백은 정해진 일정이 있나요?",
    "1년 뒤 역할이나 직급이 바뀌는 기준이 있다면 무엇인가요?"
  ],
  [
    "트레이너가 볼 수 있는 업무 기준 문서가 있나요? 마지막으로 고친 때는 언제인가요?",
    "대표나 점장이 없을 때 회원 요청은 누구에게 물어보면 되나요?",
    "제가 바로 답해도 되는 범위는 어디까지인가요?"
  ],
  [
    "동료가 그만둘 때 맡던 회원과 업무는 어떻게 넘기나요?",
    "지금 채용 중인 자리가 있나요? 인원이 비면 수업과 일정은 어떻게 조정하나요?",
    "최근 1년간 트레이너가 이 센터에서 일한 기간은 보통 어느 정도인가요?"
  ]
];

const state = { idx: 0, answers: new Array(QUESTIONS.length).fill(null), texts: new Array(QUESTIONS.length).fill('') };

const screen = document.getElementById('screen');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 2600);
}

// 받침 유무에 따라 '을/를'을 고른다. 영역 이름이 달라져도 조사가 어색해지지 않게 한다.
function eulReul(word){
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  return code >= 0 && code < 11172 && code % 28 ? '을' : '를';
}


// 답을 고른 뒤 화면이 바뀌어도 키보드·스크린리더 사용자가 새 화면의 처음으로 이동하도록 한다.
let interacted = false;
document.addEventListener('click', () => { interacted = true; }, true);
function focusScreen(){
  if (!interacted) return;
  const target = screen.querySelector('.q-text, h1, .result-headline');
  if (target){ target.setAttribute('tabindex', '-1'); target.focus(); }
}

// 영역마다 문항 수가 같지 않아도 비교되도록 가장 좋은 답 대비 비율로 주제를 고른다.
function analyze(){
  const totals = CATEGORIES.map((_, cat) => QUESTIONS.reduce((sum, q, i) => sum + (q.cat === cat ? state.answers[i] : 0), 0));
  const counts = CATEGORIES.map((_, cat) => QUESTIONS.filter(q => q.cat === cat).length);
  const ratios = totals.map((sum, i) => sum / (counts[i] * 3));
  const focus = ratios.indexOf(Math.min(...ratios));
  return { focus, allBest: ratios[focus] === 1, same: CATEGORIES.filter((_, i) => ratios[i] === ratios[focus]) };
}

function copyText(text, okMessage){
  const fallback = () => {
    const box = document.createElement('textarea');
    box.value = text; box.setAttribute('readonly', ''); box.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(box); box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    box.remove();
    showToast(ok ? okMessage : '복사하지 못했습니다. 화면의 글을 직접 선택해 복사해 주세요.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(okMessage), fallback);
  } else {
    fallback();
  }
}

const STEADY_FOLLOWUPS = [
  "정산 기준과 지급일이 계약서나 공지에도 적혀 있나요?",
  "수업 외 업무와 근무 시간이 문서나 메시지로도 확인되나요?",
  "조건이 바뀔 때 어떤 방법으로 알려 주는지 확인했나요?"
];

function followupsFor(a){ return a.allBest ? STEADY_FOLLOWUPS : FOLLOWUPS[a.focus]; }

function focusNote(a){
  if (a.allBest) return '답변에서는 바로 확인할 문제가 보이지 않았습니다. 아래 질문으로 들은 설명이 문서에도 같은지 확인해 두세요.';
  let tie = '';
  if (a.same.length > 1){
    const which = a.same.length === CATEGORIES.length ? '답변만으로는 먼저 볼 주제를 하나로 가리기 어렵습니다.' : `함께 살펴볼 주제: ${a.same.join(', ')}.`;
    tie = `${which} 이 경우 목록에서 앞에 있는 ‘${CATEGORIES[a.focus]}’${eulReul(CATEGORIES[a.focus])} 먼저 보여 줍니다. 가장 급한 주제는 직접 고르세요.`;
  }
  const lead = tie || `고른 답을 항목별로 정리해 ‘${CATEGORIES[a.focus]}’${eulReul(CATEGORIES[a.focus])} 먼저 보여 드립니다.`;
  return `${lead} 결과만으로 센터를 평가하거나 이직을 결정하지 말고, 실제 조건을 확인해 보세요.`;
}

function renderIntro(){
  screen.innerHTML = `
    <div class="intro">
      <h1>지금 일하는 곳에서<br>먼저 확인할 조건은?</h1>
      <p class="lead">급여 정산, 회원 배정, 교육에 관한 12개 질문에 답하세요. 결과에서 센터 담당자에게 물어볼 질문을 정리해 가져갈 수 있습니다. 약 3분, 무료입니다.</p>

      <div class="facts">
        <div class="fact"><b>12</b> 문항</div>
        <div class="fact"><b>6</b> 영역</div>
        <div class="fact"><b>3분</b> 내외</div>
      </div>

      <div class="cat-preview">
        ${CATEGORIES.map(c => `<div class="cat-preview-item"><span class="dot"></span>${c}</div>`).join('')}
      </div>

      <button class="primary" onclick="startQuiz()">근무 조건 확인하기</button>
      <p class="fineprint">입력한 내용은 서버로 보내지 않습니다. 결과에 나온 질문은 센터 담당자에게 직접 물어보세요. <a href="/#people">디테일랩 소개</a></p>
      <p class="fineprint"><a href="/feedback.html?area=employee&point=page">설명이 어려웠나요? 의견 남기기</a></p>
    </div>
  `;
}

function startQuiz(){
  state.idx = 0;
  renderQuestion();
}

function renderProgress(){
  const dots = QUESTIONS.map((_, i) => {
    let cls = 'progress-dot';
    if (i < state.idx) cls += ' done';
    else if (i === state.idx) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  return `<div class="progress-wrap">${dots}</div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  const catLabel = CATEGORIES[q.cat];
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx + 1} / ${QUESTIONS.length} · ${catLabel}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">
      ${q.options.map((o,oi)=>{const on=state.texts[state.idx]===o.t;return `<button class="option-btn${on?' on':''}" aria-pressed="${on}" onclick="answer(${oi})">${o.t}</button>`;}).join('')}
    </div>
    <div class="nav-row">
      ${state.idx > 0 ? `<button class="back-link" onclick="goBack()">← 이전 질문</button>` : `<span></span>`}
    </div>
  `;
  focusScreen();
}

function answer(optionIndex){
  const q = QUESTIONS[state.idx];
  state.answers[state.idx] = q.options[optionIndex].s;
  state.texts[state.idx] = q.options[optionIndex].t;
  if (state.idx < QUESTIONS.length - 1){
    state.idx += 1;
    renderQuestion();
  } else {
    renderResult();
  }
}

function goBack(){
  if (state.idx > 0){
    state.idx -= 1;
    renderQuestion();
  }
}

function renderResult(){
  const a = analyze();
  const followups = followupsFor(a);
  const followupTitle = a.allBest ? '문서로 한 번 더 확인할 것' : `${CATEGORIES[a.focus]} · 센터 담당자에게 물어볼 질문`;

  screen.innerHTML = `
    <div class="result">
      <div class="result-band band-caution">내 답변 정리</div>
      <p class="result-headline">${focusNote(a)}</p>
      <div class="insight-box"><span class="cat-name">${followupTitle}</span><ol>${followups.map(q => `<li>${q}</li>`).join('')}</ol></div>
      <div class="compare-box"><strong>누구에게 확인하나요?</strong><br>급여·회원 배정·교육을 맡는 센터 담당자에게 물어보세요. 중요한 답은 계약서나 공지, 메시지에도 적혀 있는지 확인해 두세요.</div>
      <div class="compare-box"><strong>회원과 수업 시간을 정하는 중이라면</strong><br>근무 조건이 아니라 회원과 요일·시간·횟수를 맞추는 일이 고민이라면, 같은 기기에서 회원과 각자 7개 질문에 답하는 도구를 쓸 수 있습니다. <a href="/matching-self-check.html?role=trainer">수업 조건 맞춰보기 (트레이너부터) →</a></div>
      <div class="cat-block">
        <h3>내가 고른 12개 답</h3>
        ${QUESTIONS.map((q,i)=>`<div class="cat-item"><div class="cat-item-top"><span class="name">${q.text}</span></div><p>${state.texts[i]}</p></div>`).join('')}
      </div>
      <div class="result-actions">
        <button class="primary" onclick="copyResult()">내 답변과 질문 복사하기</button>
        <button class="secondary" onclick="window.print()">질문 인쇄·PDF로 저장</button>
        <a class="feedback-link" href="/feedback.html?area=employee&point=result" target="_blank" rel="noopener noreferrer">근무 조건 질문이 쓸모 있었는지 남기기 →</a>
        <button class="secondary" onclick="renderIntro()">처음부터 다시 하기</button>
        <a class="home-link" href="/employee-guide.html">다른 제안과 비교하려면 직장 선택 기록지 쓰기</a>
      </div>
    </div>
  `;
  focusScreen();
}

function copyResult(){
  const a = analyze();
  const lines = [
    '[디테일랩 · 트레이너 근무 12문 점검]',
    a.allBest ? '문서로 한 번 더 확인할 것:' : `먼저 물을 질문 (${CATEGORIES[a.focus]}):`,
    ...followupsFor(a).map((q,i) => `${i+1}. ${q}`),
    '확인할 사람: 센터 담당자에게 실제 조건을 묻고 관련 문서에서 확인하세요.',
    '',
    ...QUESTIONS.map((q,i)=>`${q.text}\n→ ${state.texts[i]}`)
  ];
  copyText(lines.join('\n'), '결과가 복사되었습니다');
}

renderIntro();
</script>
