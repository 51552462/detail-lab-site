<style>
  :root{
    --bg: #10141b;
    --bg-soft: #171c25;
    --panel: #1b212c;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #ECEDEF;
    --ink-dim: #9AA3AF;
    --ink-faint: #8A94A3;
    --accent: #00A99D;
    --accent-soft: rgba(0,169,157,0.14);
    --danger: #E4572E;
    --danger-soft: rgba(228,87,46,0.16);
    --caution: #E3A008;
    --caution-soft: rgba(227,160,8,0.16);
    --stable: #3FA34D;
    --stable-soft: rgba(63,163,77,0.16);
    --radius: 14px;
    --maxw: 560px;
  }

  * { box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word;
  }

  .app{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 60px;
  }

  .brandline{
    width: 100%;
    max-width: var(--maxw);
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin-bottom: 28px;
  }
  .brandline .mark{
    color: var(--ink-dim);
    font-weight: 600;
  }

  .screen{
    width: 100%;
    max-width: var(--maxw);
  }

  /* ---------- Intro ---------- */
  .intro h1{
    font-size: 30px;
    line-height: 1.32;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  .intro p.lead{
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  .facts{
    display:flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .fact{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .fact b{ color: var(--ink); font-weight: 700; }

  .cat-preview{
    display:flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .cat-preview-item{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-dim);
  }
  .cat-preview-item .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  button.primary{
    width: 100%;
    background: var(--accent);
    color: #06201d;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button.primary:active{ transform: scale(0.98); }

  .fineprint{
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }

  /* ---------- Quiz ---------- */
  .progress-wrap{
    display:flex;
    gap: 5px;
    margin-bottom: 28px;
  }
  .progress-dot{
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--panel-border);
    overflow: hidden;
  }
  .progress-dot.done{ background: var(--accent); }
  .progress-dot.current{ background: var(--ink-faint); }

  .q-meta{
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }
  .q-text{
    font-size: 21px;
    line-height: 1.45;
    font-weight: 700;
    margin: 0 0 24px;
  }

  .options{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn{
    text-align:left;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 16px 16px;
    font-size: 14.5px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option-btn:hover{ border-color: rgba(0,169,157,0.5); }
  .option-btn:active{ background: var(--accent-soft); }
  .option-btn.on{ border-color: rgba(0,169,157,0.95); background: var(--accent-soft); }

  .nav-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 22px;
  }
  .back-link{
    color: var(--ink-faint);
    font-size: 13px;
    cursor: pointer;
    background:none; border:none;
    padding: 8px 0;
  }
  .back-link:hover{ color: var(--ink-dim); }

  /* ---------- Result ---------- */
  .result-band{
    display:inline-block;
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .band-stable{ background: var(--stable-soft); color: var(--stable); }
  .band-caution{ background: var(--caution-soft); color: var(--caution); }
  .band-danger{ background: var(--danger-soft); color: var(--danger); }

  .score-row{
    display:flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .score-num{
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .score-suffix{
    font-size: 16px;
    color: var(--ink-dim);
  }

  .result-headline{
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  .cat-block{
    margin-bottom: 28px;
  }
  .cat-block h3{
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: none;
    margin: 0 0 12px;
  }
  .cat-item{
    margin-bottom: 14px;
  }
  .cat-item-top{
    display:flex;
    justify-content: space-between;
    font-size: 13.5px;
    margin-bottom: 6px;
  }
  .cat-item > p{ margin: 0; color: var(--ink-dim); font-size: 13.5px; line-height: 1.5; }
  .cat-item-top .name{ color: var(--ink); font-weight: 600; }
  .cat-item-top .pct{ color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .cat-bar-track{
    height: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    overflow: hidden;
  }
  .cat-bar-fill{
    height: 100%;
    border-radius: 5px;
  }

  .insight-box{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--danger);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-dim);
    margin-bottom: 28px;
  }
  .insight-box b{ color: var(--ink); }
  .insight-box .cat-name{ color: #F27A54; font-weight: 700; }
  .insight-box ol{ margin: 12px 0 0; padding-left: 20px; }
  .insight-box li{ margin-bottom: 8px; color: var(--ink); }
  .insight-box li:last-child{ margin-bottom: 0; }

  .compare-box{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 28px;
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  .compare-box b{ color: var(--ink); }

  .result-actions{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .feedback-link{display:block;padding:10px;text-align:center;color:var(--accent);font-size:13px;font-weight:700;text-underline-offset:4px}
  button.secondary{
    width: 100%;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary:hover{ border-color: var(--ink-faint); color: var(--ink); }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show{ opacity: 1; }

  @media (max-width: 420px){
    .intro h1{ font-size: 25px; }
    .q-text{ font-size: 19px; }
    .score-num{ font-size: 44px; }
  }
  .fineprint a{ color:var(--ink-dim); text-underline-offset:3px; }
  .fineprint a:hover{ color:var(--ink); }
  .brandline a.mark{ text-decoration:none; }
  .brandline a.mark:hover{ color:var(--ink); }
  .home-link{ display:block; padding:10px; text-align:center; color:var(--ink-dim); font-size:13px; text-underline-offset:4px; }
  [tabindex="-1"]:focus{ outline:none; }

.case-notes{margin:18px 0;padding:18px;border:1px solid var(--line,#303440);border-radius:12px}
.case-notes h3{font-size:17px;margin:0 0 10px}
.case-notes label{display:block;margin:12px 0;font-size:14px;line-height:1.6}
.case-notes input{display:block;width:100%;max-width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid var(--line,#303440);border-radius:6px;background:var(--bg,#101216);color:var(--ink,#f1f3f7);font:inherit}

</style>

const state = { idx: 0, answers: new Array(QUESTIONS.length).fill(null), texts: new Array(QUESTIONS.length).fill('') };

function showToast(msg){

// 답을 고른 뒤 화면이 바뀌어도 키보드·스크린리더 사용자가 새 화면의 처음으로 이동하도록 한다.
let interacted = false;
document.addEventListener('click', () => { interacted = true; }, true);
function focusScreen(){
  if (!interacted) return;

}

// 영역마다 문항 수가 같지 않아도 비교되도록 가장 좋은 답 대비 비율로 주제를 고른다.
function analyze(){
  // 사례 없음·확인 전은 문제 점수로 보지 않는다. 숫자는 검토 주제를 고르기 위한 내부 배열값이다.
  const counts = CATEGORIES.map((_, cat) => QUESTIONS.filter((q, i) => q.cat === cat && Number.isFinite(state.answers[i])).length);
  const totals = CATEGORIES.map((_, cat) => QUESTIONS.reduce((sum, q, i) => sum + (q.cat === cat && Number.isFinite(state.answers[i]) ? state.answers[i] : 0), 0));
  const ratios = totals.map((sum, i) => counts[i] ? sum / (counts[i] * 3) : Infinity);
  const known = state.answers.filter(Number.isFinite);
  const noneKnown = known.length === 0;
  const focus = noneKnown ? 0 : ratios.indexOf(Math.min(...ratios));
  return { focus, noneKnown, unknown: QUESTIONS.length - known.length, allBest: known.length > 0 && known.every(n => n === 3), same: noneKnown ? [] : CATEGORIES.filter((_, i) => ratios[i] === ratios[focus]) };
}

function copyText(text, okMessage){
  const fallback = () => {
    const box = document.createElement('textarea');
    box.value = text; box.setAttribute('readonly', ''); box.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(box); box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    box.remove();
    showToast(ok ? okMessage : '복사하지 못했습니다. 화면의 글을 직접 선택해 복사해 주세요.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(okMessage), fallback);
  } else {
    fallback();
  }
}

function followupsFor(a){ return a.allBest ? STEADY_FOLLOWUPS : FOLLOWUPS[a.focus]; }

function focusNote(a){
  if (a.noneKnown) return '실제 사례에 답한 항목이 없어 근무 조건을 판단하지 않았습니다. 아래 질문은 확인을 시작하는 참고입니다.';

  let tie = '';
  if (a.same.length > 1){
    const which = a.same.length === CATEGORIES.length ? '답변만으로는 먼저 볼 주제를 하나로 가리기 어렵습니다.' : `함께 살펴볼 주제: ${a.same.join(', ')}.`;
    tie = `${which} 이 경우 목록에서 앞에 있는 ‘${CATEGORIES[a.focus]}’을 먼저 보여 줍니다. 가장 급한 주제는 직접 고르세요.`;
  }
  const lead = tie || `고른 답을 항목별로 정리해 ‘${CATEGORIES[a.focus]}’을 먼저 보여 드립니다.`;
  return `${lead} 결과만으로 센터를 평가하거나 이직을 결정하지 말고, 실제 조건을 확인해 보세요. 확인 전·사례 없음 ${a.unknown}개는 비교에서 제외했습니다.`;
}

function startQuiz(){
  state.idx = 0;
  renderQuestion();
}

function renderProgress(){
  const dots = QUESTIONS.map((_, i) => {
    let cls = 'progress-dot';
    if (i < state.idx) cls += ' done';
    else if (i === state.idx) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  return `<div class="progress-wrap">${dots}</div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  const catLabel = CATEGORIES[q.cat];
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx + 1} / ${QUESTIONS.length} · ${catLabel}</div>
    <div class="q-text">${q.text}</div><p class="fineprint">최근 4주 안의 실제 처리에 가장 가까운 답을 고르세요. 해당 사례가 없거나 기억·기록을 확인하지 못했다면 마지막 답을 고르세요.</p>
    <div class="options">
      ${q.options.map((o,oi)=>{const on=state.texts[state.idx]===o.t;return `<button class="option-btn${on?' on':''}" aria-pressed="${on}" onclick="answer(${oi})">${o.t}</button>`;}).join('')}
    </div>
    <div class="nav-row">
      ${state.idx > 0 ? `<button class="back-link" onclick="goBack()">← 이전 질문</button>` : `<span></span>`}
    </div>
  `;
  focusScreen();
}

function answer(optionIndex){
  const q = QUESTIONS[state.idx];
  state.answers[state.idx] = q.options[optionIndex].s;
  state.texts[state.idx] = q.options[optionIndex].t;
  if (state.idx < QUESTIONS.length - 1){
    state.idx += 1;
    renderQuestion();
  } else {
    renderResult();
  }
}

function goBack(){
  if (state.idx > 0){
    state.idx -= 1;
    renderQuestion();
  }
}

  const a = analyze();
  const followups = followupsFor(a);

        <button class="primary" onclick="copyResult()">내 답변과 질문 복사하기</button>
        <a class="feedback-link" href="/feedback.html?area=employee&point=result" target="_blank" rel="noopener noreferrer">근무 조건 질문이 쓸모 있었는지 남기기 →</a>
        <button class="secondary" onclick="renderIntro()">처음부터 다시 하기</button>
        <a class="home-link" href="/employee-guide.html">다른 제안과 비교하려면 직장 선택 기록지 쓰기</a>

function copyResult(){
  const a = analyze();
  const lines = [
    '[디테일랩 · 트레이너 근무 조건 확인]',
    focusNote(a),
    ...preserveLines(),...evidenceLines(),
    a.allBest ? '문서로 한 번 더 확인할 것:' : `먼저 물을 질문 (${CATEGORIES[a.focus]}):`,
    ...followupsFor(a).map((q,i) => `${i+1}. ${q}`),
    '확인할 사람: 센터 담당자에게 실제 조건을 묻고 관련 문서에서 확인하세요.',
    '',
    ...QUESTIONS.map((q,i)=>`${q.text}\n→ ${state.texts[i]}`)
  ];
  copyText(lines.join('\n'), '결과가 복사되었습니다');
}

renderIntro();
</script>

</body>
</html>
