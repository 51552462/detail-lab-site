<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트레이너·회원 만남 확인 · 디테일랩</title>
<meta name="description" content="회원과 트레이너가 각자 답해 일정·설명·피드백의 어긋남을 봅니다. 점수·자동추천·건강정보 없음.">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="트레이너·회원 만남 확인 · 디테일랩">
<meta property="og:description" content="회원과 트레이너가 각자 답해 일정·설명·피드백의 어긋남을 봅니다. 점수·자동추천·건강정보 없음.">
<meta property="og:image" content="og-trainer.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="트레이너·회원 만남 확인 · 디테일랩">
<meta name="twitter:image" content="og-trainer.png">
<style>
  :root{
    --bg: #10141b;
    --bg-soft: #171c25;
    --panel: #1b212c;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #ECEDEF;
    --ink-dim: #9AA3AF;
    --ink-faint: #5C6570;
    --accent: #00A99D;
    --accent-soft: rgba(0,169,157,0.14);
    --danger: #E4572E;
    --danger-soft: rgba(228,87,46,0.16);
    --caution: #E3A008;
    --caution-soft: rgba(227,160,8,0.16);
    --stable: #3FA34D;
    --stable-soft: rgba(63,163,77,0.16);
    --radius: 14px;
    --maxw: 560px;
  }

  * { box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 60px;
  }

  .brandline{
    width: 100%;
    max-width: var(--maxw);
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin-bottom: 28px;
  }
  .brandline .mark{
    color: var(--ink-dim);
    font-weight: 600;
  }

  .screen{
    width: 100%;
    max-width: var(--maxw);
  }

  /* ---------- Intro ---------- */
  .intro h1{
    font-size: 30px;
    line-height: 1.32;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  .intro p.lead{
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  .facts{
    display:flex;
    gap: 10px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .fact{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .fact b{ color: var(--ink); font-weight: 700; }

  .cat-preview{
    display:flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .cat-preview-item{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-dim);
  }
  .cat-preview-item .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  button.primary{
    width: 100%;
    background: var(--accent);
    color: #06201d;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button.primary:active{ transform: scale(0.98); }

  .fineprint{
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }

  /* ---------- Quiz ---------- */
  .progress-wrap{
    display:flex;
    gap: 5px;
    margin-bottom: 28px;
  }
  .progress-dot{
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--panel-border);
    overflow: hidden;
  }
  .progress-dot.done{ background: var(--accent); }
  .progress-dot.current{ background: var(--ink-faint); }

  .q-meta{
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }
  .q-text{
    font-size: 21px;
    line-height: 1.45;
    font-weight: 700;
    margin: 0 0 24px;
  }

  .options{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn{
    text-align:left;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 16px 16px;
    font-size: 14.5px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option-btn:hover{ border-color: rgba(0,169,157,0.5); }
  .option-btn:active{ background: var(--accent-soft); }
  .option-btn.on{ border-color: rgba(217,98,43,0.85); background: var(--accent-soft); }
  .multi-hint{ font-size:13px; color:var(--ink-dim); margin:-8px 0 16px; }

  .nav-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 22px;
  }
  .back-link{
    color: var(--ink-faint);
    font-size: 13px;
    cursor: pointer;
    background:none; border:none;
    padding: 8px 0;
  }
  .back-link:hover{ color: var(--ink-dim); }

  /* ---------- Result ---------- */
  .result-band{
    display:inline-block;
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .band-stable{ background: var(--stable-soft); color: var(--stable); }
  .band-caution{ background: var(--caution-soft); color: var(--caution); }
  .band-danger{ background: var(--danger-soft); color: var(--danger); }

  .score-row{
    display:flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .score-num{
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .score-suffix{
    font-size: 16px;
    color: var(--ink-dim);
  }

  .result-headline{
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  .cat-block{
    margin-bottom: 28px;
  }
  .cat-block h3{
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: none;
    margin: 0 0 12px;
  }
  .cat-item{
    margin-bottom: 14px;
  }
  .cat-item-top{
    display:flex;
    justify-content: space-between;
    font-size: 13.5px;
    margin-bottom: 6px;
  }
  .cat-item-top .name{ color: var(--ink); font-weight: 600; }
  .cat-item-top .pct{ color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .cat-bar-track{
    height: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    overflow: hidden;
  }
  .cat-bar-fill{
    height: 100%;
    border-radius: 5px;
  }

  .insight-box{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--danger);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-dim);
    margin-bottom: 28px;
  }
  .insight-box b{ color: var(--ink); }
  .insight-box .cat-name{ color: var(--danger); font-weight: 700; }

  .compare-box{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 28px;
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  .compare-box b{ color: var(--ink); }

  .result-actions{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  a.cta-link{ text-decoration:none; display:block; }
  button.secondary{
    width: 100%;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary:hover{ border-color: var(--ink-faint); color: var(--ink); }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show{ opacity: 1; }

  @media (max-width: 420px){
    .intro h1{ font-size: 25px; }
    .q-text{ font-size: 19px; }
    .score-num{ font-size: 44px; }
  }
.pair-consent{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--panel-border);border-radius:10px;color:var(--ink-dim);font-size:13px;line-height:1.5}.pair-consent input{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}.pair-grid{display:grid;gap:12px;margin-bottom:24px}.pair-row{display:grid;gap:5px;padding:15px;background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;color:var(--ink-dim);font-size:13px}.pair-row strong{color:var(--ink);font-size:15px}.pair-row em{font-style:normal;color:var(--accent)}
</style>
</head>
<body>

<div class="app">
  <div class="brandline">
    <span class="mark">디테일랩</span>
    <span>만남 확인 · 점수·추천·건강정보 없음</span>
  </div>

  <div class="screen" id="screen"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ["월","화","수","목","금","토","일"];

const MEMBER_Q = [
  { text:"지금 목표에 가장 가까운 것은?", options:["체중관리","근력","자세","기타"] },
  { text:"가능한 요일은?", options:DAYS, multi:true },
  { text:"가능한 시간대는?", options:["오전","오후","저녁"] },
  { text:"주당 몇 회를 원하나요?", options:["1회","2회","3회 이상"] },
  { text:"설명은 어느 쪽이 편한가요?", options:["짧고 핵심만","원리까지","상황마다 다름"] },
  { text:"피드백은 얼마나 자주 듣고 싶나요?", options:["동작마다","세트마다","수업 끝"] },
  { text:"대면으로 가능한 기간은?", options:["1개월","3개월","6개월 이상","미정"] }
];

const TRAINER_Q = [
  { text:"가능한 요일은?", options:DAYS, multi:true },
  { text:"가능한 시간대는?", options:["오전","오후","저녁"] },
  { text:"한 회원과 주당 몇 회까지 가능한가요?", options:["1회","2회","3회 이상"] },
  { text:"수업 방식은 어느 쪽에 가깝나요?", options:["짧고 핵심만","원리설명","회원 반응 따라"] },
  { text:"피드백 빈도는?", options:["동작마다","세트마다","수업 끝"] },
  { text:"맡기 어려운 조건이 있다면?", options:["특정 요일에 수업이 몰림","이동 동선이 김","연속 수업 사이 공백이 김","특별히 없음"] },
  { text:"대면 가능 기간은?", options:["1개월","3개월","6개월 이상","미정"] }
];

const state = { idx: 0, texts: [], role: "", multiSel: [], pair: {member:null,trainer:null} };

const screen = document.getElementById("screen");
const toastEl = document.getElementById("toast");

function bank(){ return state.role === "member" ? MEMBER_Q : TRAINER_Q; }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=> toastEl.classList.remove("show"), 1800);
}

function renderIntro(){
  const preset = new URLSearchParams(location.search).get("role");
  if (preset === "member" || preset === "trainer") { pickRole(preset); return; }
  screen.innerHTML = `
    <div class="intro">
      <h1>목표는 같아 보여도,<br>한 주가 어디서 어긋나나요?</h1>
      <p class="lead">회원과 트레이너가 각자 답합니다. 점수·자동 추천·건강정보 수집이 없습니다. 한 사람만 답하면 자기 답만 보입니다. 두 사람이 각자 동의하고 같은 기기에서 이어서 답하면 항목을 나란히 볼 수 있습니다.</p>
      <div class="facts">
        <div class="fact"><b>회원</b> 7문</div>
        <div class="fact"><b>트레이너</b> 7문</div>
        <div class="fact"><b>전송·저장</b> 없음</div>
      </div>
      <button class="primary" onclick="pickRole('member')">회원용 시작</button>
      <button class="secondary" style="margin-top:10px" onclick="pickRole('trainer')">트레이너용 시작</button>
      <p class="fineprint">예전 대표·직원용 주소는 더 이상 이 상품이 아닙니다. 역할을 다시 고르면 됩니다.</p>
    </div>
  `;
}

function pickRole(role){
  state.role = role;
  state.idx = 0;
  state.texts = new Array(bank().length).fill("");
  state.multiSel = [];
  history.replaceState({}, "", location.pathname + "?role=" + role);
  renderRoleIntro();
}

function renderRoleIntro(){
  const isMember = state.role === "member";
  screen.innerHTML = `
    <div class="intro">
      <h1>${isMember ? "회원이 보는 한 주" : "트레이너가 보는 한 주"}</h1>
      <p class="lead">${isMember
        ? "7문입니다. 병력·체성분 질문이 아닙니다. 점수로 사람을 고르지 않습니다."
        : "7문입니다. 일정·수업 방식만 묻습니다. 건강·신체 조건 문항이 없습니다."}</p>
      <div class="facts">
        <div class="fact"><b>${bank().length}</b> 문항</div>
        <div class="fact"><b>대조</b> 두 사람 동의 후 같은 기기</div>
      </div>
      <button class="primary" onclick="startQuiz()">시작</button>
      <p class="fineprint"><button class="back-link" onclick="state.role=''; history.replaceState({},'',location.pathname); renderIntro()">역할 다시 고르기</button></p>
    </div>
  `;
}

function startQuiz(){
  state.idx = 0;
  state.multiSel = [];
  renderQuestion();
}

function renderProgress(){
  const dots = bank().map((_, i) => {
    let cls = "progress-dot";
    if (i < state.idx) cls += " done";
    else if (i === state.idx) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");
  return `<div class="progress-wrap">${dots}</div>`;
}

function renderQuestion(){
  const q = bank()[state.idx];
  const catLabel = state.role === "member" ? "회원" : "트레이너";
  if (q.multi) {
    const buttons = q.options.map((label) => {
      const on = state.multiSel.indexOf(label) !== -1 ? " on" : "";
      return `<button type="button" class="option-btn${on}" onclick="toggleMulti('${label}')">${label}</button>`;
    }).join("");
    screen.innerHTML = `
      ${renderProgress()}
      <div class="q-meta">${state.idx + 1} / ${bank().length} · ${catLabel}</div>
      <div class="q-text">${q.text}</div>
      <p class="multi-hint">해당하는 요일을 모두 고른 뒤 다음으로 갑니다.</p>
      <div class="options">${buttons}</div>
      <button class="primary" style="margin-top:18px" onclick="commitMulti()">다음</button>
      <div class="nav-row">
        ${state.idx > 0 ? `<button class="back-link" onclick="goBack()">← 이전 질문</button>` : `<span></span>`}
      </div>
    `;
    return;
  }
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx + 1} / ${bank().length} · ${catLabel}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">
      ${q.options.map((label, oi) => `<button class="option-btn" onclick="answer(${oi})">${label}</button>`).join("")}
    </div>
    <div class="nav-row">
      ${state.idx > 0 ? `<button class="back-link" onclick="goBack()">← 이전 질문</button>` : `<span></span>`}
    </div>
  `;
}

function toggleMulti(label){
  const i = state.multiSel.indexOf(label);
  if (i === -1) state.multiSel.push(label);
  else state.multiSel.splice(i, 1);
  renderQuestion();
}

function commitMulti(){
  if (!state.multiSel.length) {
    showToast("요일을 하나 이상 골라 주세요.");
    return;
  }
  state.texts[state.idx] = state.multiSel.join("·");
  state.multiSel = [];
  advance();
}

function answer(optionIndex){
  const q = bank()[state.idx];
  state.texts[state.idx] = q.options[optionIndex];
  advance();
}

function advance(){
  if (state.idx < bank().length - 1){
    state.idx += 1;
    state.multiSel = [];
    renderQuestion();
  } else {
    renderResult();
  }
}

function goBack(){
  if (state.idx > 0){
    state.idx -= 1;
    state.multiSel = [];
    renderQuestion();
  }
}

function renderResult(){
  const rows = bank().map((q,i)=>`<div class="cat-item"><div class="cat-item-top"><span class="name">${q.text}</span></div><p style="margin:0;color:var(--ink-dim);font-size:13.5px;line-height:1.5">${state.texts[i]||""}</p></div>`).join("");
  const otherLabel = state.role === "member" ? "트레이너" : "회원";
  screen.innerHTML = `
    <div class="result">
      <div class="result-band band-caution">${state.role === "member" ? "회원 답변" : "트레이너 답변"} · 점수 없음</div>
      <p class="result-headline">현재는 본인의 답만 보입니다. 같은 기기에서 두 사람이 각각 화면 공유에 동의하면 일정·수업 방식의 항목별 대조를 볼 수 있습니다. 서버 전송과 자동 추천은 없습니다.</p>
      <div class="cat-block"><h3>이번 답변 · 화면을 닫으면 사라짐</h3>${rows}</div>
      <div class="result-actions">
        <label class="pair-consent"><input type="checkbox" id="pair-consent"> 내 답의 항목을 상대방에게 보여 주는 데 동의합니다. 같은 기기에서 이어서 확인합니다.</label>
        <button class="primary" onclick="acceptPair()">동의하고 ${otherLabel}에게 기기 넘기기${state.pair[otherRole()] ? " · 대조 보기" : ""}</button>
        <button class="secondary" onclick="copyResult()">내 결과 복사하기</button>
        <button class="secondary" onclick="clearPair()">답변 모두 지우고 처음부터</button>
      </div>
    </div>
  `;
}

function otherRole(){ return state.role === "member" ? "trainer" : "member"; }

function acceptPair(){
  if (!document.getElementById("pair-consent").checked) {
    showToast("항목 공유에 동의해야 이어서 볼 수 있습니다.");
    return;
  }
  state.pair[state.role] = [...state.texts];
  state.texts = [];
  if (state.pair[otherRole()]) renderPairResult();
  else {
    const next = otherRole();
    screen.innerHTML = `<div class="intro"><h1>이제 ${next === "member" ? "회원" : "트레이너"} 차례입니다</h1>
      <p class="lead">첫 번째 답은 이 화면이 열려 있는 동안만 메모리에 있습니다. 상대방에게 화면을 넘기기 전에 개인 답을 볼 수 있으며, 두 번째 사람도 별도로 동의해야 대조가 보입니다. 새로고침하거나 닫으면 지워집니다.</p>
      <button class="primary" onclick="pickRole('${next}')">내 질문 시작</button>
      <button class="secondary" style="margin-top:10px" onclick="clearPair()">모두 지우기</button></div>`;
  }
}

function comparePair(member,trainer){
  const sharedDays = member[1].split("·").filter(day => trainer[0].split("·").includes(day));
  const frequency = ["1회","2회","3회 이상"];
  const length = ["1개월","3개월","6개월 이상"];
  const explanation = member[4] === "상황마다 다름" || trainer[3] === "회원 반응 따라"
    ? "첫 수업에서 확인" : member[4] === trainer[3] || (member[4] === "원리까지" && trainer[3] === "원리설명") ? "표현상 가까움" : "설명 방식 대화 필요";
  return [
    ["요일",member[1],trainer[0],sharedDays.length ? "공통 요일: "+sharedDays.join("·") : "공통 요일 없음"],
    ["시간대",member[2],trainer[1],member[2] === trainer[1] ? "같은 시간대" : "시간대 조율 필요"],
    ["주당 횟수",member[3],trainer[2],frequency.indexOf(member[3]) <= frequency.indexOf(trainer[2]) ? "가능 범위로 보임 · 실제 빈 시간 확인" : "희망 횟수 초과"],
    ["대면 가능 기간",member[6],trainer[6],member[6] === "미정" || trainer[6] === "미정" ? "기간 확인 필요" : length.indexOf(member[6]) <= length.indexOf(trainer[6]) ? "기간 범위로 보임" : "기간 조율 필요"],
    ["설명 방식",member[4],trainer[3],explanation],
    ["피드백 빈도",member[5],trainer[4],member[5] === trainer[4] ? "표현상 같음" : "첫 수업에서 맞춰 보기"]
  ];
}

function renderPairResult(){
  const member = state.pair.member, trainer = state.pair.trainer;
  if (!member || !trainer) return;
  const rows = comparePair(member,trainer).map(([label,left,right,read]) =>
    `<div class="pair-row"><strong>${label}</strong><span>회원: ${left}</span><span>트레이너: ${right}</span><em>${read}</em></div>`).join("");
  screen.innerHTML = `<div class="result">
    <div class="result-band band-caution">양측 동의 · 항목 대조 시안</div>
    <h1>함께 확인할 한 주</h1>
    <p class="result-headline">일정과 응답 방식만 나란히 본 결과입니다. 빈 시간이 실제로 남아 있는지, 첫 수업에서 호흡이 맞는지, 취소·변경 기준은 여기서 알 수 없습니다. 이 결과는 매칭·추천·계약을 보장하지 않습니다.</p>
    <div class="pair-grid" aria-label="회원과 트레이너의 항목별 대조">${rows}</div>
    <div class="compare-box">회원의 목표와 트레이너의 수업 제약은 같은 척도로 평가할 수 없어 점수에 넣지 않았습니다. 첫 대화에서 목표·특정 요일의 밀집·변경 가능성을 따로 확인하세요.</div>
    <div class="result-actions"><button class="secondary" onclick="clearPair()">대조 결과와 답변 지우기</button></div>
  </div>`;
}

function clearPair(){
  state.pair = {member:null,trainer:null};
  state.role = ""; state.idx = 0; state.texts = []; state.multiSel = [];
  history.replaceState({}, "", location.pathname);
  renderIntro();
}

function copyResult(){
  const roleLabel = state.role === "member" ? "회원" : "트레이너";
  const lines = [
    "[트레이너·회원 만남 확인 · " + roleLabel + " · 점수 없음]",
    "",
    ...bank().map((q,i)=> q.text + "\n→ " + (state.texts[i]||"")),
    "",
    "이 복사본은 본인이 직접 공유할 때만 상대에게 보입니다.",
    "by 디테일랩"
  ];
  const copied = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(copied).then(()=>showToast("결과가 복사되었습니다")).catch(()=>showToast("복사하지 못했습니다"));
  } else {
    showToast("복사를 지원하지 않는 환경입니다");
  }
}

renderIntro();

</script>

</body>
</html>
