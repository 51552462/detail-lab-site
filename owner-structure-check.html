const state = { idx:0, answers:new Array(QUESTIONS.length).fill(null), texts:new Array(QUESTIONS.length).fill('') };
const screen = document.getElementById('screen');
const toastEl = document.getElementById('toast');

function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2600); }

// 답을 고른 뒤 화면이 바뀌어도 키보드·스크린리더 사용자가 새 화면의 처음으로 이동하도록 한다.
let interacted = false;
document.addEventListener('click', () => { interacted = true; }, true);
function focusScreen(){
  if (!interacted) return;
  const target = screen.querySelector('.q-text, h1, .result-headline');
  if (target){ target.setAttribute('tabindex', '-1'); target.focus(); }
}

function analyze(){
  // 사례 없음·확인 전은 문제 점수로 보지 않는다. 숫자는 검토 주제를 고르기 위한 내부 배열값이다.
  const counts = CATEGORIES.map((_, cat) => QUESTIONS.filter((q, i) => q.cat === cat && Number.isFinite(state.answers[i])).length);
  const totals = CATEGORIES.map((_, cat) => QUESTIONS.reduce((sum, q, i) => sum + (q.cat === cat && Number.isFinite(state.answers[i]) ? state.answers[i] : 0), 0));
  const ratios = totals.map((sum, i) => counts[i] ? sum / (counts[i] * 3) : Infinity);
  const known = state.answers.filter(Number.isFinite);
  const noneKnown = known.length === 0;
  const focus = noneKnown ? 0 : ratios.indexOf(Math.min(...ratios));
  return { focus, noneKnown, unknown: QUESTIONS.length - known.length, allBest: known.length > 0 && known.every(n => n === 3), same: noneKnown ? [] : CATEGORIES.filter((_, i) => ratios[i] === ratios[focus]) };
}

function preserveLines(){

function selectionBasis(a){
  if (a.noneKnown) return '실제 사례에 답한 항목이 없어 먼저 볼 문제를 정하지 않았습니다. 아래 카드는 기록을 시작하는 참고이며 진단 결과가 아닙니다.';
  const uncertainty = a.unknown ? ` 확인 전·사례 없음 ${a.unknown}개는 비교에서 제외했습니다.` : '';
  if (a.allBest) return '이번 답변에서는 더 점검할 일이 드러나지 않았습니다. 실제 센터 운영도 답한 내용과 같은지 한 번 확인해 보세요.' + (a.unknown ? ` 확인 전·사례 없음 ${a.unknown}개는 비교에서 제외했습니다. 확인한 일부 답만으로 전체 상태를 판단하지 않습니다.` : '');
  const sameCat = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q, i }) => q.cat === a.focus && Number.isFinite(state.answers[i]));
  const example = sameCat.reduce((x, y) => state.answers[x.i] <= state.answers[y.i] ? x : y);
  let tie = '';
  if (a.same.length > 1){
    const which = a.same.length === CATEGORIES.length ? '답변만으로는 먼저 볼 주제를 하나로 가리기 어렵습니다.' : `함께 살펴볼 주제: ${a.same.join(', ')}.`;
    tie = `${which} 이 경우 목록에서 앞에 있는 ‘${CATEGORIES[a.focus]}’을 먼저 보여 줍니다. 실제로 먼저 다룰 일은 직접 고르세요. `;
  }
  const lead = tie || `고른 답을 항목별로 정리해 ‘${CATEGORIES[a.focus]}’을 먼저 보여 드립니다. `;
  return `${lead}다시 볼 질문과 답: ${example.q.text} → ${state.texts[example.i]}. 이 결과는 현장의 위험도를 측정한 값이 아닙니다.${uncertainty}`;
}

function copyText(text, okMessage){
  const fallback = () => {
    const box = document.createElement('textarea');
    box.value = text; box.setAttribute('readonly', ''); box.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(box); box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    box.remove();
    showToast(ok ? okMessage : '복사하지 못했습니다. 화면의 글을 직접 선택해 복사해 주세요.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(okMessage), fallback);
  } else {
    fallback();
  }
}

function startQuiz(){ state.idx = 0; renderQuestion(); }

function renderProgress(){
  return `<div class="progress-wrap">${QUESTIONS.map((_,i)=>{

  }).join('')}</div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx+1} / ${QUESTIONS.length} · ${CATEGORIES[q.cat]}</div>

    <div class="options">${q.options.map((o,oi)=>{const on=state.texts[state.idx]===o.t;return `<button class="option-btn${on?' on':''}" aria-pressed="${on}" onclick="answer(${oi})">${o.t}</button>`;}).join('')}</div>
    <div class="nav-row">${state.idx>0?`<button class="back-link" onclick="goBack()">← 이전 질문</button>`:`<span></span>`}</div>
  `;
  focusScreen();
}

function answer(oi){
  const q = QUESTIONS[state.idx];
  state.answers[state.idx] = q.options[oi].s;
  state.texts[state.idx] = q.options[oi].t;
  if(state.idx < QUESTIONS.length-1){ state.idx+=1; renderQuestion(); }
  else{ renderResult(); }
}

function goBack(){ if(state.idx>0){ state.idx-=1; renderQuestion(); } }

function renderResult(){
  const rows = QUESTIONS.map((q,i)=>`<div class="cat-item"><div class="cat-item-top"><span class="name">${q.text}</span></div><p style="margin:0;color:var(--ink-dim);font-size:13.5px;line-height:1.5">${state.texts[i]||''}</p></div>`).join('');
  const a = analyze();
  const card = (a.allBest || a.noneKnown) ? STEADY_CARD : MANUALS[a.focus];
  const headline = a.noneKnown
    ? '실제 사례가 없어 먼저 볼 문제를 정하지 않았습니다. 아래는 확인을 시작할 때 쓰는 참고 카드입니다.'
    : a.allBest
    ? '답변에서는 바로 손볼 일이 보이지 않았습니다. 이번 주 실제 운영도 답한 내용과 같은지 확인해 보세요.'
    : `먼저 <strong>${CATEGORIES[a.focus]}</strong>을 살펴보세요. 아래 카드는 고른 답을 바탕으로 제안한 일입니다. 실제로 무엇을 바꿀지는 직원과 확인해 정하세요.`;
  const next = (a.allBest || a.noneKnown) ? null : NEXT_CHECKS[a.focus];
  const nextBox = next ? `<div class="compare-box"><strong>더 구체적으로 보고 싶다면</strong><br>${next.why} <a href="${next.href}">${next.name} →</a></div>` : '';
  screen.innerHTML = `
    <div class="result">
      <div class="result-band band-caution">내 답변으로 만든 이번 주 카드</div>
      <p class="result-headline">${headline}</p>
      ${preserveBox()}
      <div class="manual-box"><h4>${card.h}</h4><ul>${card.items.map(item=>`<li>${item}</li>`).join('')}</ul></div>
      <details class="compare-box why-box"><summary>왜 이 주제가 나왔나요?</summary><p>${selectionBasis(a)}</p></details>
      <div class="compare-box"><strong>직원과 함께 확인하세요</strong><br>실제로 일을 맡는 직원에게 이 방법을 쓸 수 있는지 물어보세요. 디테일랩이 답변을 검토하는 진단은 아래에서 별도로 신청할 수 있습니다.</div>
      ${nextBox}
      ${evidenceBox()}
      <div class="cat-block"><h3>내가 고른 12개 답</h3>${rows}</div>
      <div class="result-actions">
        <a class="cta-link" target="_blank" rel="noopener noreferrer" href="https://wary-crocus-59c.notion.site/3c5f6ead7401804e87d7fbb6d086bba2">무료 센터 운영 진단 신청하기</a>
        <p class="fineprint" style="margin:0 0 6px">직원 3~10명 헬스·PT 센터 대상 · 이번 모집 3곳 무료 · 신청서는 새 창에서 열립니다.</p>
        <button class="secondary" onclick="copyResult()">이번 주 카드와 답변 복사하기</button>
        <a class="feedback-link" href="/feedback.html?area=center&point=result" target="_blank" rel="noopener noreferrer">결과가 쓸모 있었는지 의견 남기기 →</a>
        <button class="secondary" onclick="renderIntro()">처음부터 다시 하기</button>
        <a class="home-link" href="/center.html">센터 운영 진단 설명으로 돌아가기</a>
      </div>
    </div>
  `;
  focusScreen();
}

function copyResult(){
  const a = analyze();
  const card = (a.allBest || a.noneKnown) ? STEADY_CARD : MANUALS[a.focus];
  const lines = ['[디테일랩 · 센터 운영 확인]','',`이 주제를 보여 준 이유: ${selectionBasis(a)}`,...preserveLines(),...evidenceLines(),'확인할 사람: 센터에서 실제 업무를 맡는 직원에게 가능한 범위를 확인하세요. 디테일랩의 사람 검토는 별도 18문 진단 신청 시 진행합니다.','',card.h,...card.items.map((item,i)=>`${i+1}. ${item}`),'',...QUESTIONS.map((q,i)=>`${q.text}\n→ ${state.texts[i]||''}`)];
  copyText(lines.join('\n'), '결과가 복사되었습니다');
}

renderIntro();
</script>
