<script>
const CATEGORIES = ["리더십·의사결정","역할·권한","운영·매뉴얼·고객경험","재무·정산·내부통제"];

const QUESTIONS = [
  { cat:0, text:"본인이 3일 이상 자리를 비우면 센터 운영에 문제가 생기나요?", options:[
    {t:"전혀 없다, 부매니저가 다 처리한다", s:3},
    {t:"약간의 혼선은 있지만 큰 문제는 없다", s:2},
    {t:"예약·정산·클레임 등에서 티가 난다", s:1},
    {t:"거의 마비 수준이 된다", s:0},
  ]},
  { cat:0, text:"센터의 중요한 결정(가격, 프로모션, 채용)을 본인 외에 누가 내릴 수 있나요?", options:[
    {t:"팀장급도 일정 권한 안에서 결정 가능하다", s:3},
    {t:"상의는 하지만 최종 결정은 항상 나", s:2},
    {t:"사실상 나만 결정할 수 있다", s:1},
    {t:"결정 기준 자체가 없어서 매번 감으로 정한다", s:0},
  ]},
  { cat:0, text:"이번 달, 내가 직접 처리하지 않아도 됐던 문제가 몇 건이나 있었나요?", options:[
    {t:"대부분(70% 이상)이 직원 선에서 해결됐다", s:3},
    {t:"절반 정도", s:2},
    {t:"거의 대부분 내가 나서야 했다", s:1},
    {t:"전부 내가 처리했다", s:0},
  ]},
  { cat:1, text:"직원별로 누가 무슨 업무를 담당하는지 문서로 정리돼 있나요?", options:[
    {t:"있고 신규 직원 교육에도 쓴다", s:3},
    {t:"대략 있지만 실제와는 다르다", s:2},
    {t:"머릿속에만 있다", s:1},
    {t:"없다, 그때그때 시킨다", s:0},
  ]},
  { cat:1, text:"직원이 그만두면 그 업무의 인수인계가 얼마나 매끄럽게 되나요?", options:[
    {t:"문서·매뉴얼 기반으로 대체로 매끄럽다", s:3},
    {t:"어느 정도 되지만 시간이 걸린다", s:2},
    {t:"거의 처음부터 다시 만들어야 한다", s:1},
    {t:"인수인계라는 개념이 없다", s:0},
  ]},
  { cat:1, text:"직원 간 업무 범위가 겹치거나, 반대로 아무도 안 하는 업무가 있나요?", options:[
    {t:"없다, 역할이 명확하다", s:3},
    {t:"가끔 있지만 큰 문제는 안 된다", s:2},
    {t:"자주 발생하고 갈등의 원인이 된다", s:1},
    {t:"매번 누가 할지 그때그때 정한다", s:0},
  ]},
  { cat:2, text:"신규 회원 등록부터 첫 PT까지의 프로세스가 매뉴얼로 정리돼 있나요?", options:[
    {t:"있고 모든 직원이 동일하게 적용한다", s:3},
    {t:"있지만 직원마다 조금씩 다르게 한다", s:2},
    {t:"예전에 만들다 만 문서가 있다", s:1},
    {t:"없다, 각자 알아서 한다", s:0},
  ]},
  { cat:2, text:"시설·장비 점검(청소, 고장, 안전)이 정기적으로 이뤄지나요?", options:[
    {t:"체크리스트 기반으로 정기 점검한다", s:3},
    {t:"눈에 띄면 그때그때 고친다", s:2},
    {t:"회원이 불만을 제기해야 알게 된다", s:1},
    {t:"특별히 정해진 게 없다", s:0},
  ]},
  { cat:2, text:"회원 컴플레인이 들어오면 대응 기준(환불, 보상 등)이 있나요?", options:[
    {t:"명확한 기준이 있고 직원도 알고 있다", s:3},
    {t:"대략 있지만 케이스마다 다르게 처리된다", s:2},
    {t:"사실상 내가 그때그때 판단한다", s:1},
    {t:"기준 없이 감정적으로 처리될 때가 많다", s:0},
  ]},
  { cat:3, text:"이번 달 매출·지출을 지금 바로 숫자로 말할 수 있나요?", options:[
    {t:"실시간으로 파악하고 있다", s:3},
    {t:"대략은 알지만 정확한 숫자는 확인이 필요하다", s:2},
    {t:"월말 정산 때나 알게 된다", s:1},
    {t:"정확히 파악이 안 된다", s:0},
  ]},
  { cat:3, text:"현금·카드 매출, 회원권 환불 등에서 직원의 실수나 부정을 막을 장치가 있나요?", options:[
    {t:"이중 확인·시스템 기록 등 장치가 있다", s:3},
    {t:"어느 정도 있지만 허점이 있다", s:2},
    {t:"전적으로 신뢰에 의존한다", s:1},
    {t:"특별한 장치가 없다", s:0},
  ]},
  { cat:3, text:"회원권 환불·정지 등 재무에 영향 있는 결정 기준이 문서화돼 있나요?", options:[
    {t:"명확한 규정이 있고 일관되게 적용된다", s:3},
    {t:"있지만 예외가 잦다", s:2},
    {t:"관행으로만 존재한다", s:1},
    {t:"없다, 그때그때 협상한다", s:0},
  ]},
];

const MANUALS = [
  { h:"이번 주 안에 할 수 있는 최소 조치 — 리더십·의사결정", items:[
    "이번 주 내가 처리한 일 중 '위임 가능했던 것' 3개 적어보기",
    "그 일에 대해 '이 정도까지는 직원이 결정 가능'을 한 줄로 정하기",
    "다음 부재 시 누가 대신 결정할지 이름 하나 지정하기",
  ]},
  { h:"이번 주 안에 할 수 있는 최소 조치 — 역할·권한", items:[
    "직원별 담당 업무를 한 줄씩 적어 목록 만들기",
    "겹치는 업무, 비어있는 업무 표시하기",
    "신입 인수인계 시 확인할 체크리스트 3가지 만들기",
  ]},
  { h:"이번 주 안에 할 수 있는 최소 조치 — 운영·매뉴얼", items:[
    "신규 회원 등록~첫 PT까지 과정을 5단계로 쪼개 적기",
    "각 단계별 '누가, 무엇을' 하는지 한 줄씩 채우기",
    "이번 주 신규 회원 1명에게 그대로 적용해보고 안 맞는 부분 표시하기",
  ]},
  { h:"이번 주 안에 할 수 있는 최소 조치 — 재무·내부통제", items:[
    "이번 달 매출·지출을 오늘 기준으로 확인해서 적어두기",
    "환불·정지 기준을 한 문장으로 정해두기",
    "현금 처리 시 이중 확인(사진, 서명 등) 1가지 추가하기",
  ]},
];

const state = { idx:0, answers:new Array(QUESTIONS.length).fill(null), texts:new Array(QUESTIONS.length).fill('') };
const screen = document.getElementById('screen');
const toastEl = document.getElementById('toast');

function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2600); }

// 답을 고른 뒤 화면이 바뀌어도 키보드·스크린리더 사용자가 새 화면의 처음으로 이동하도록 한다.
let interacted = false;
document.addEventListener('click', () => { interacted = true; }, true);
function focusScreen(){
  if (!interacted) return;
  const target = screen.querySelector('.q-text, h1, .result-headline');
  if (target){ target.setAttribute('tabindex', '-1'); target.focus(); }
}

function analyze(){
  const totals = CATEGORIES.map((_, cat) => QUESTIONS.reduce((sum, q, i) => sum + (q.cat === cat ? state.answers[i] : 0), 0));
  const counts = CATEGORIES.map((_, cat) => QUESTIONS.filter(q => q.cat === cat).length);
  const ratios = totals.map((sum, i) => sum / (counts[i] * 3));
  const focus = ratios.indexOf(Math.min(...ratios));
  return { focus, allBest: ratios[focus] === 1, same: CATEGORIES.filter((_, i) => ratios[i] === ratios[focus]) };
}

function selectionBasis(a){
  if (a.allBest) return '고른 12개 답이 모두 가장 안정적인 쪽이라 먼저 손볼 주제를 정하지 않았습니다. 이 결과는 대표·관리자의 기억에 따른 것이므로, 실제로 자리를 비운 하루를 골라 답한 대로 되는지 확인해 보세요.';
  const sameCat = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q }) => q.cat === a.focus);
  const example = sameCat.reduce((x, y) => state.answers[x.i] <= state.answers[y.i] ? x : y);
  let tie = '';
  if (a.same.length > 1){
    const which = a.same.length === CATEGORIES.length ? '모든 영역이 같은 정도로 나왔습니다.' : `같은 정도로 나온 주제: ${a.same.join(', ')}.`;
    tie = `${which} 화면 순서상 앞의 ${CATEGORIES[a.focus]} 영역을 먼저 보여 줄 뿐이니, 실제로 먼저 다룰 일은 직접 고르세요. `;
  }
  const lead = tie || `${CATEGORIES[a.focus]} 영역에서 고른 답이 가장 안정적인 답과 가장 멀어서 먼저 보여 드립니다. `;
  return `${lead}다시 살펴볼 답: ${example.q.text} → ${state.texts[example.i]}. 이 결과는 현장의 위험도를 측정한 값이 아닙니다.`;
}

// 먼저 살펴볼 주제와 이어지는 다른 점검. 재무·정산에는 이어 볼 도구가 없어 비워 둔다.
const NEXT_CHECKS = [
  { href:"/industry-self-check.html", name:"대표 호출·반복 질문 12문 점검", why:"먼저 살펴볼 주제가 대표에게 돌아오는 결정이라면, 손님 앞에서 대표를 부르는 장면을 따로 점검할 수 있습니다." },
  { href:"/guide-self-check.html", name:"교대 인수인계 12문 점검", why:"역할이 모호하면 교대 때 일이 끊기기 쉽습니다. 교대 메모가 다음 사람의 행동으로 이어지는지 따로 점검할 수 있습니다." },
  { href:"/industry-self-check.html", name:"대표 호출·반복 질문 12문 점검", why:"기준이 문서에 없으면 직원은 매번 대표에게 묻게 됩니다. 직원이 말해도 되는 범위가 적혀 있는지 따로 점검할 수 있습니다." },
  null,
];

function copyText(text, okMessage){
  const fallback = () => {
    const box = document.createElement('textarea');
    box.value = text; box.setAttribute('readonly', ''); box.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(box); box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    box.remove();
    showToast(ok ? okMessage : '복사하지 못했습니다. 화면의 글을 직접 선택해 복사해 주세요.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(okMessage), fallback);
  } else {
    fallback();
  }
}

const STEADY_CARD = { h:"이번 주 안에 할 수 있는 확인 · 답한 대로 되는지", items:[
  "이번 주 대표가 자리를 비우는 하루를 정하고, 그날 직원이 대표에게 물어본 일을 적어 두세요.",
  "대표 없이 끝난 일과 뒤늦게 고쳐야 했던 일을 나눠 보세요.",
  "그 기록을 바탕으로 다음 주에 직원이 결정해도 되는 일 한 가지를 정하세요.",
]};

function renderIntro(){
  screen.innerHTML = `
    <div class="intro">
      <h1>대표가 자리를 비울 때<br>어떤 일이 멈추나요?</h1>
      <p class="lead">역할과 결정, 운영 기준, 숫자 확인 방식에 관한 12문에 답하고 이번 주 살펴볼 한 가지를 고르세요. 약 3분, 무료입니다.</p>
      <div class="facts">
        <div class="fact"><b>12</b> 문항</div>
        <div class="fact"><b>4</b> 영역</div>
        <div class="fact"><b>3분</b> 내외</div>
      </div>
      <div class="cat-preview">
        ${CATEGORIES.map(c=>`<div class="cat-preview-item"><span class="dot"></span>${c}</div>`).join('')}
      </div>
      <button class="primary" onclick="startQuiz()">운영 흐름 확인하기</button>
      <p class="fineprint">이 자가점검은 브라우저가 답을 정리하며 디테일랩이 입력을 읽지 않습니다. 사람이 검토하는 18문 운영 진단은 결과 화면에서 별도로 신청할 수 있습니다. <a href="/#people">디테일랩의 시작과 기록 방식</a></p>
      <p class="fineprint"><a href="/feedback.html?area=center&point=page">시작 전에 부족했던 설명 남기기</a></p>
    </div>
  `;
}

function startQuiz(){ state.idx = 0; renderQuestion(); }

function renderProgress(){
  return `<div class="progress-wrap">${QUESTIONS.map((_,i)=>{
    let cls='progress-dot'; if(i<state.idx) cls+=' done'; else if(i===state.idx) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx+1} / ${QUESTIONS.length} · ${CATEGORIES[q.cat]}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">${q.options.map((o,oi)=>{const on=state.texts[state.idx]===o.t;return `<button class="option-btn${on?' on':''}" aria-pressed="${on}" onclick="answer(${oi})">${o.t}</button>`;}).join('')}</div>
    <div class="nav-row">${state.idx>0?`<button class="back-link" onclick="goBack()">← 이전 질문</button>`:`<span></span>`}</div>
  `;
  focusScreen();
}

function answer(oi){
  const q = QUESTIONS[state.idx];
  state.answers[state.idx] = q.options[oi].s;
  state.texts[state.idx] = q.options[oi].t;
  if(state.idx < QUESTIONS.length-1){ state.idx+=1; renderQuestion(); }
  else{ renderResult(); }
}

function goBack(){ if(state.idx>0){ state.idx-=1; renderQuestion(); } }

function renderResult(){
  const rows = QUESTIONS.map((q,i)=>`<div class="cat-item"><div class="cat-item-top"><span class="name">${q.text}</span></div><p style="margin:0;color:var(--ink-dim);font-size:13.5px;line-height:1.5">${state.texts[i]||''}</p></div>`).join('');
  const a = analyze();
  const card = a.allBest ? STEADY_CARD : MANUALS[a.focus];
  const headline = a.allBest
    ? '이번 답변에서는 먼저 손볼 주제가 드러나지 않았습니다. 대신 답한 대로 실제 운영이 되는지 확인하는 카드를 드립니다.'
    : `이번 답변에서 먼저 살펴볼 주제는 <strong>${CATEGORIES[a.focus]}</strong>입니다. 답변의 우선순위를 정리한 것으로 원인이나 위험도를 확정하지 않습니다.`;
  const next = a.allBest ? null : NEXT_CHECKS[a.focus];
  const nextBox = next ? `<div class="compare-box"><strong>더 구체적으로 보고 싶다면</strong><br>${next.why} <a href="${next.href}">${next.name} →</a></div>` : '';
  screen.innerHTML = `
    <div class="result">
      <div class="result-band band-caution">내 답변으로 만든 이번 주 카드</div>
      <p class="result-headline">${headline}</p>
      <div class="manual-box"><h4>${card.h}</h4><ul>${card.items.map(item=>`<li>${item}</li>`).join('')}</ul></div>
      <details class="compare-box why-box"><summary>왜 이 주제가 나왔나요?</summary><p>${selectionBasis(a)}</p></details>
      <div class="compare-box"><strong>사람과 함께 확인할 것</strong><br>이 결과에는 센터 대표·관리자가 고른 답만 담겨 있습니다. 실제로 업무를 맡을 직원에게 가능한 범위를 확인하고, 바꿀 일은 센터에서 결정하세요. 디테일랩의 사람 검토는 아래 18문 진단을 별도로 신청한 경우에 진행합니다.</div>
      ${nextBox}
      <div class="cat-block"><h3>내가 고른 12개 답</h3>${rows}</div>
      <div class="result-actions">
        <a class="cta-link" target="_blank" rel="noopener noreferrer" href="https://wary-crocus-59c.notion.site/3c5f6ead7401804e87d7fbb6d086bba2">무료 센터 운영 진단 신청하기</a>
        <p class="fineprint" style="margin:0 0 6px">직원 3~10명 헬스·PT 센터 대상 · 이번 모집 3곳 무료 · 신청서는 새 창에서 열립니다.</p>
        <button class="secondary" onclick="copyResult()">이번 주 카드와 답변 복사하기</button>
        <a class="feedback-link" href="/feedback.html?area=center&point=result" target="_blank" rel="noopener noreferrer">결과가 쓸모 있었는지 의견 남기기 →</a>
        <button class="secondary" onclick="renderIntro()">처음부터 다시 하기</button>
        <a class="home-link" href="/center.html">센터 운영 진단 설명으로 돌아가기</a>
      </div>
    </div>
  `;
  focusScreen();
}

function copyResult(){
  const a = analyze();
  const card = a.allBest ? STEADY_CARD : MANUALS[a.focus];
  const lines = ['[디테일랩 · 센터 운영 확인]','',`주제 선정 근거: ${selectionBasis(a)}`,'확인할 사람: 센터에서 실제 업무를 맡는 직원에게 가능한 범위를 확인하세요. 디테일랩의 사람 검토는 별도 18문 진단 신청 시 진행합니다.','',card.h,...card.items.map((item,i)=>`${i+1}. ${item}`),'',...QUESTIONS.map((q,i)=>`${q.text}\n→ ${state.texts[i]||''}`)];
  copyText(lines.join('\n'), '결과가 복사되었습니다');
}

renderIntro();
</script>
