<style>
  :root{
    --bg: #12141A;
    --panel: #1A1D24;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #ECEDEF;
    --ink-dim: #9AA3AF;
    --ink-faint: #8A94A3;
    --accent: #D9622B;
    --accent-ink: #1C0D06;
    --accent-soft: rgba(217,98,43,0.14);
    --danger: #E4572E;
    --danger-soft: rgba(228,87,46,0.16);
    --caution: #E3A008;
    --caution-soft: rgba(227,160,8,0.16);
    --stable: #3FA34D;
    --stable-soft: rgba(63,163,77,0.16);
    --radius: 14px;
    --maxw: 560px;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 20px 60px; }
  .brandline{ width:100%; max-width:var(--maxw); display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--ink-faint); margin-bottom:28px; }
  .brandline .mark{ color: var(--ink-dim); font-weight:600; }
  .screen{ width:100%; max-width:var(--maxw); }

  .intro h1{ font-size:29px; line-height:1.32; font-weight:800; letter-spacing:-0.01em; margin:0 0 14px; }
  .intro p.lead{ font-size:15px; line-height:1.6; color:var(--ink-dim); margin:0 0 28px; }
  .facts{ display:flex; gap:10px; margin-bottom:32px; flex-wrap:wrap; }
  .fact{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--ink-dim); }
  .fact b{ color:var(--ink); font-weight:700; }
  .cat-preview{ display:flex; flex-direction:column; gap:8px; margin-bottom:32px; }
  .cat-preview-item{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink-dim); }
  .cat-preview-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  button.primary{ width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px; padding:16px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .12s ease; }
  button.primary:active{ transform:scale(0.98); }
  .fineprint{ font-size:12px; color:var(--ink-faint); text-align:center; margin-top:14px; line-height:1.5; }

  .progress-wrap{ display:flex; gap:5px; margin-bottom:28px; }
  .progress-dot{ flex:1; height:4px; border-radius:2px; background:var(--panel-border); }
  .progress-dot.done{ background:var(--accent); }
  .progress-dot.current{ background:var(--ink-faint); }
  .q-meta{ font-size:12.5px; color:var(--accent); font-weight:700; margin-bottom:10px; }
  .q-text{ font-size:21px; line-height:1.45; font-weight:700; margin:0 0 24px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option-btn{ text-align:left; background:var(--panel); border:1px solid var(--panel-border); color:var(--ink); border-radius:var(--radius); padding:16px; font-size:14.5px; line-height:1.5; cursor:pointer; transition:border-color .12s ease, background .12s ease; }
  .option-btn:hover{ border-color: rgba(217,98,43,0.5); }
  .option-btn:active{ background: var(--accent-soft); }
  .option-btn.on{ border-color: rgba(217,98,43,0.95); background: var(--accent-soft); }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
  .back-link{ color:var(--ink-faint); font-size:13px; cursor:pointer; background:none; border:none; padding:8px 0; }
  .back-link:hover{ color:var(--ink-dim); }

  .result-band{ display:inline-block; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:100px; margin-bottom:14px; }
  .band-stable{ background:var(--stable-soft); color:var(--stable); }
  .band-caution{ background:var(--caution-soft); color:var(--caution); }
  .band-danger{ background:var(--danger-soft); color:var(--danger); }
  .score-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .score-num{ font-size:52px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; }
  .score-suffix{ font-size:16px; color:var(--ink-dim); }
  .result-headline{ font-size:16px; line-height:1.6; color:var(--ink-dim); margin:0 0 28px; }

  .cat-block{ margin-bottom:28px; }
  .cat-block h3{ font-size:13px; font-weight:700; color:var(--ink-faint); margin:0 0 12px; }
  .cat-item{ margin-bottom:14px; }
  .cat-item-top{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .cat-item-top .name{ color:var(--ink); font-weight:600; }

  .cat-bar-track{ height:8px; background:var(--panel); border:1px solid var(--panel-border); border-radius:5px; overflow:hidden; }

  .insight-box{ background:var(--panel); border:1px solid var(--panel-border); border-left:3px solid var(--danger); border-radius:10px; padding:16px 18px; font-size:14px; line-height:1.65; color:var(--ink-dim); margin-bottom:20px; }
  .insight-box .cat-name{ color:var(--danger); font-weight:700; }

  .manual-box{ background:var(--panel); border:1px solid var(--panel-border); border-left:3px solid var(--accent); border-radius:10px; padding:18px; margin-bottom:28px; }
  .manual-box h4{ margin:0 0 10px; font-size:14px; color:var(--ink); }
  .manual-box ul{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.8; color:var(--ink-dim); }
  .record-box{ background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:18px; margin-bottom:28px; }
  .record-box h3{ margin:0 0 6px; font-size:15px; }
  .record-box p{ margin:0 0 14px; color:var(--ink-dim); font-size:13px; line-height:1.6; }
  .record-box label{ display:block; margin:0 0 13px; color:var(--ink); font-size:13px; font-weight:700; }
  .record-box input{ display:block; width:100%; box-sizing:border-box; margin-top:6px; padding:12px; border:1px solid var(--panel-border); border-radius:9px; background:var(--bg); color:var(--ink); font:inherit; }

  .compare-box{ background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:18px; margin-bottom:28px; font-size:13.5px; color:var(--ink-dim); line-height:1.6; }

  .compare-box a{ color:var(--accent); font-weight:700; text-underline-offset:3px; }

  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  .feedback-link{display:block;padding:10px;text-align:center;color:var(--accent);font-size:13px;font-weight:700;text-underline-offset:4px}
  button.secondary{ width:100%; background:transparent; color:var(--ink-dim); border:1px solid var(--panel-border); border-radius:12px; padding:14px; font-size:14.5px; font-weight:600; cursor:pointer; }
  button.secondary:hover{ border-color:var(--ink-faint); color:var(--ink); }
  a.cta-link{ text-decoration:none; display:block; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--panel-border); color:var(--ink); padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .toast.show{ opacity:1; }
  .field{ width:100%; margin:0 0 14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:6px; }
  .field input{ width:100%; background:var(--panel); border:1px solid var(--panel-border); color:var(--ink); border-radius:10px; padding:12px 14px; font-size:15px; }
  .hidden{ position:absolute; left:-9999px; }

  @media (max-width:420px){ .intro h1{ font-size:24px; } .q-text{ font-size:19px; } .score-num{ font-size:44px; } }
  .fineprint a{ color:var(--ink-dim); text-underline-offset:3px; }
  .fineprint a:hover{ color:var(--ink); }
  .brandline a.mark{ text-decoration:none; }
  .brandline a.mark:hover{ color:var(--ink); }
  .home-link{ display:block; padding:10px; text-align:center; color:var(--ink-dim); font-size:13px; text-underline-offset:4px; }
  [tabindex="-1"]:focus{ outline:none; }
  .why-box summary{ cursor:pointer; color:var(--ink); font-weight:700; }
  .why-box[open] summary{ margin-bottom:8px; }
  .why-box p{ margin:0; }
  .why-box summary:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main id="main">
<div class="app">
  
  <div class="brandline"><a class="mark" href="/" aria-label="디테일랩 홈으로">디테일랩</a><span>우리 가게 인수인계 점검</span></div>
  <div class="screen" id="screen"></div>
  <noscript><p class="fineprint">이 도구는 브라우저에서 JavaScript가 켜져 있어야 작동합니다. <a href="/">디테일랩 처음으로</a></p></noscript>
</div>
</main>

<script>
const CATEGORIES = ["대표 개입","반복 질문","문서화된 범위","완료 시점"];

const QUESTIONS = [
  { cat:0, text:"최근 7일, 손님이 앞에서 기다릴 때 대표가 직접 답을 말한 횟수는 어느 쪽인가요?", options:[
    {t:"0~1회, 직원 선에서 대부분 끝냈다", s:3},
    {t:"2~3회", s:2},
    {t:"4~6회", s:1},
    {t:"매일 여러 번, 거의 대표가 말했다", s:0},
  ]},
  { cat:0, text:"최근 4주, 직원이 “잠깐만요, 대표님께 물어볼게요”라고 한 장면은 몇 번인가요?", options:[
    {t:"거의 없었다", s:3},
    {t:"1~2번", s:2},
    {t:"주 1회 이상", s:1},
    {t:"손님이 올 때마다 반복됐다", s:0},
  ]},
  { cat:0, text:"대표가 자리를 비운 하루 동안, 손님 응대가 막힌 일은 몇 건이었나요?", options:[
    {t:"0건, 직원이 범위 안에서 말했다", s:3},
    {t:"1건 정도", s:2},
    {t:"2~3건", s:1},
    {t:"하루가 그 질문들로 붙잡혔다", s:0},
  ]},
  { cat:1, text:"같은 종류의 손님 질문(시간 변경, 예외, 할인 등)이 일주일 안에 다시 돌아온 횟수는?", options:[
    {t:"거의 다시 안 돌아온다", s:3},
    {t:"주 1회 안팎", s:2},
    {t:"주 2~3회", s:1},
    {t:"같은 말이 매일 다시 열린다", s:0},
  ]},
  { cat:1, text:"최근 4주, 손님에게 직원마다 다른 답을 준 장면은 있었나요?", options:[
    {t:"없었다", s:3},
    {t:"한 번 있었다", s:2},
    {t:"여러 번 있었다", s:1},
    {t:"손님이 어느 직원을 만나느냐에 따라 답이 갈린다", s:0},
  ]},
  { cat:1, text:"반복되는 응대 한 종류를, 숫자로 세고 있나요?", options:[
    {t:"세고 있고 이번 주 숫자도 말할 수 있다", s:3},
    {t:"대략은 알지만 숫자는 없다", s:2},
    {t:"느낌만 있다", s:1},
    {t:"세어 본 적이 없다", s:0},
  ]},
  { cat:2, text:"대표 부재 중에도 직원이 말해도 되는 범위가 문서로 있나요?", options:[
    {t:"있고 직원이 그 문장을 쓴다", s:3},
    {t:"대략 있지만 실제와 다르다", s:2},
    {t:"머릿속에만 있다", s:1},
    {t:"없다. 그때그때 묻는다", s:0},
  ]},
  { cat:2, text:"할인·예외·일정 변경을 이번 달 직원 선에서 끝낸 비율은?", options:[
    {t:"대부분 직원 선에서 끝냈다", s:3},
    {t:"절반 정도", s:2},
    {t:"거의 대표가 마무리했다", s:1},
    {t:"전부 대표가 말했다", s:0},
  ]},
  { cat:2, text:"역할(누가 정하고 누가 실행하는지)이 손님 응대에서 보이나요?", options:[
    {t:"손님이 봐도 누가 말하는지 분명하다", s:3},
    {t:"안에서는 알지만 손님 앞에서는 흔들린다", s:2},
    {t:"직원마다 다르게 움직인다", s:1},
    {t:"매번 누가 할지 그때 정한다", s:0},
  ]},
  { cat:3, text:"일이 끝났다고 보는 시점(완료 기준)이 적혀 있나요?", options:[
    {t:"있고 다음 사람도 그 시점을 쓴다", s:3},
    {t:"대략 있지만 사람마다 다르다", s:2},
    {t:"처리 중이라고만 남긴다", s:1},
    {t:"완료라는 말이 없다", s:0},
  ]},
  { cat:3, text:"교대 메모가 다음 사람의 행동으로 읽히나요?", options:[
    {t:"다음 사람이 읽고 바로 움직인다", s:3},
    {t:"반은 되고 반은 다시 묻는다", s:2},
    {t:"기록은 있는데 행동이 없다", s:1},
    {t:"메모 자체가 거의 없다", s:0},
  ]},
  { cat:3, text:"문서가 있어도 실제 응대와 얼마나 다른가요?", options:[
    {t:"문서대로 한다", s:3},
    {t:"가끔 다르다", s:2},
    {t:"자주 다르다", s:1},
    {t:"문서는 장식이고 현장은 따로 굴러간다", s:0},
  ]},
];

const MANUALS = [
  { h:"대표에게 돌아오는 질문", items:[
    "최근 대표가 직접 답한 요청 한 종류를 고르고 날짜와 내용을 적어 보세요.",
    "중요한 예외는 그대로 대표가 맡고, 직원이 바로 안내해도 되는 범위만 따로 정하세요.",
    "7일 뒤 같은 요청이 다시 대표에게 온 횟수를 확인하세요.",
  ]},
  { h:"반복되는 손님 질문", items:[
    "가장 자주 다시 들어오는 질문 한 종류를 고르고 이번 주 횟수를 세어 보세요.",
    "담당자가 확인할 수 있는 답과 확인이 필요한 예외를 한 곳에 적으세요.",
    "7일 뒤 같은 질문의 재문의 횟수를 다시 세어 보세요.",
  ]},
  { h:"직원이 답할 수 있는 범위", items:[
    "일정 변경처럼 반복되는 업무 하나를 골라 누가 어디까지 답할 수 있는지 적으세요.",
    "안전·환불·인사·재무 같은 중요한 판단은 별도로 책임자를 정하세요.",
    "7일 동안 정한 문장을 실제로 사용했는지 확인하세요.",
  ]},
  { h:"교대 뒤 완료 확인", items:[
    "최근 교대 때 멈춘 일 한 건을 고르고, 누가 언제까지 마무리하는지 적으세요.",
    "다음 근무자가 알아야 할 요청·담당자·완료 조건을 한 줄로 남기세요.",
    "7일 뒤 같은 건을 다시 물은 횟수를 확인하세요.",
  ]},
];

const state = { idx:0, answers:new Array(QUESTIONS.length).fill(null), texts:new Array(QUESTIONS.length).fill('') };
const screen = document.getElementById('screen');
const toastEl = document.getElementById('toast');

function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2600); }

// 답을 고른 뒤 화면이 바뀌어도 키보드·스크린리더 사용자가 새 화면의 처음으로 이동하도록 한다.
let interacted = false;
document.addEventListener('click', () => { interacted = true; }, true);
function focusScreen(){
  if (!interacted) return;
  const target = screen.querySelector('.q-text, h1, .result-headline');
  if (target){ target.setAttribute('tabindex', '-1'); target.focus(); }
}

function analyze(){
  const totals = CATEGORIES.map((_, cat) => QUESTIONS.reduce((sum, q, i) => sum + (q.cat === cat ? state.answers[i] : 0), 0));
  const counts = CATEGORIES.map((_, cat) => QUESTIONS.filter(q => q.cat === cat).length);
  const ratios = totals.map((sum, i) => sum / (counts[i] * 3));
  const focus = ratios.indexOf(Math.min(...ratios));
  return { focus, allBest: ratios[focus] === 1, same: CATEGORIES.filter((_, i) => ratios[i] === ratios[focus]) };
}

function selectionBasis(a){
  if (a.allBest) return '고른 12개 답이 모두 가장 안정적인 쪽이라 먼저 손볼 주제를 정하지 않았습니다. 이 결과는 내 기억에 따른 것이므로, 실제 응대 한 건을 골라 답한 대로 되는지 확인해 보세요.';
  const sameCat = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q }) => q.cat === a.focus);
  const example = sameCat.reduce((x, y) => state.answers[x.i] <= state.answers[y.i] ? x : y);
  let tie = '';
  if (a.same.length > 1){
    const which = a.same.length === CATEGORIES.length ? '모든 영역이 같은 정도로 나왔습니다.' : `같은 정도로 나온 주제: ${a.same.join(', ')}.`;
    tie = `${which} 화면 순서상 앞의 ${CATEGORIES[a.focus]} 영역을 먼저 보여 줄 뿐이니, 어느 업무부터 볼지는 직접 고르세요. `;
  }
  const lead = tie || `${CATEGORIES[a.focus]} 영역에서 고른 답이 가장 안정적인 답과 가장 멀어서 먼저 보여 드립니다. `;
  return `${lead}다시 살펴볼 답: ${example.q.text} → ${state.texts[example.i]}.${tie} 이 결과는 실제 원인이나 위험도를 판정한 값이 아닙니다.`;
}

function copyText(text, okMessage){
  const fallback = () => {
    const box = document.createElement('textarea');
    box.value = text; box.setAttribute('readonly', ''); box.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(box); box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    box.remove();
    showToast(ok ? okMessage : '복사하지 못했습니다. 화면의 글을 직접 선택해 복사해 주세요.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(okMessage), fallback);
  } else {
    fallback();
  }
}

const STEADY_CARD = { h:"답한 대로 되는지 확인", items:[
  "최근 손님 문의 한 종류를 골라, 직원이 대표에게 묻지 않고 답했는지 이번 주 기록해 보세요.",
  "직원이 말해도 되는 범위와 대표가 승인할 예외를 한 줄씩 적어, 직원이 그대로 알고 있는지 물어보세요.",
  "7일 뒤 같은 요청이 다시 돌아온 횟수를 세어 보세요.",
]};

function renderIntro(){
  screen.innerHTML = `
    <div class="intro">
      <h1>우리 가게에서 일이 다시 돌아오는 곳은?</h1>
      <p class="lead">최근의 응대·교대 장면을 떠올리며 12개 질문에 답하세요. 고른 답을 정리하고 7일 동안 한 가지를 확인할 실행 카드를 드립니다. 약 5분, 무료입니다.</p>
      <div class="facts">
        <div class="fact"><b>12</b> 문항</div>
        <div class="fact"><b>7일</b> 실행 카드</div>
        <div class="fact"><b>저장</b> 직접 복사</div>
      </div>
      <button class="primary" onclick="startQuiz()">우리 가게 점검 시작</button>
      <p class="fineprint">답변은 브라우저에서만 처리되며 디테일랩이 입력을 보지 않습니다. 이 결과는 가게와 직원을 평가하거나 실제 원인을 확정하지 않습니다. <a href="/#people">디테일랩의 시작과 기록 방식</a></p>
      <p class="fineprint"><a href="/feedback.html?area=industry&point=page">시작 전에 부족했던 설명 남기기</a></p>
    </div>
  `;
}

function startQuiz(){ state.idx = 0; renderQuestion(); }

function renderProgress(){
  return `<div class="progress-wrap">${QUESTIONS.map((_,i)=>{
    let cls='progress-dot'; if(i<state.idx) cls+=' done'; else if(i===state.idx) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  screen.innerHTML = `
    ${renderProgress()}
    <div class="q-meta">${state.idx+1} / ${QUESTIONS.length} · ${CATEGORIES[q.cat]}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">${q.options.map((o,oi)=>{const on=state.texts[state.idx]===o.t;return `<button class="option-btn${on?' on':''}" aria-pressed="${on}" onclick="answer(${oi})">${o.t}</button>`;}).join('')}</div>
    <div class="nav-row">${state.idx>0?`<button class="back-link" onclick="goBack()">← 이전 질문</button>`:`<span></span>`}</div>
  `;
  focusScreen();
}

function answer(oi){
  const q = QUESTIONS[state.idx];
  state.answers[state.idx] = q.options[oi].s;
  state.texts[state.idx] = q.options[oi].t;
  if(state.idx < QUESTIONS.length-1){ state.idx+=1; renderQuestion(); }
  else{ renderResult(); }
}

function goBack(){ if(state.idx>0){ state.idx-=1; renderQuestion(); } }

function renderResult(){
  const rows = QUESTIONS.map((q,i)=>`<div class="cat-item"><div class="cat-item-top"><span class="name">${q.text}</span></div><p style="margin:0;color:var(--ink-dim);font-size:13.5px;line-height:1.5">${state.texts[i]||''}</p></div>`).join('');
  const a = analyze();
  const card = a.allBest ? STEADY_CARD : MANUALS[a.focus];
  const headline = a.allBest
    ? '이번 답변에서는 먼저 손볼 주제가 드러나지 않았습니다. 대신 답한 대로 실제 응대가 되는지 확인하는 카드를 드립니다.'
    : `이번 답변으로 골라 본 첫 확인 주제는 <strong>${CATEGORIES[a.focus]}</strong>입니다. 같은 정도의 주제가 여러 개일 수도 있으며 원인·위험도 판정이 아닙니다.`;
  const nextBox = !a.allBest && a.focus === 3
    ? '<div class="compare-box"><strong>더 구체적으로 보고 싶다면</strong><br>일이 끝났다고 보는 시점이 흐리면 교대 때 일이 끊기기 쉽습니다. 교대 메모만 따로 12문으로 점검할 수 있습니다. <a href="/guide-self-check.html">교대 인수인계 12문 점검 →</a></div>'
    : '';
  screen.innerHTML = `
    <div class="result">
      <div class="result-band band-caution">내 답변으로 만든 7일 확인 카드</div>
      <p class="result-headline">${headline}</p>
      <div class="manual-box">
        <h4>7일 동안 먼저 볼 것 · ${card.h}</h4>
        <ul>${card.items.map(item=>`<li>${item}</li>`).join('')}</ul>
      </div>
      <div class="record-box">
        <h3>우리 가게의 한 건을 적어 두세요</h3>
        <p>선택 답만으로 실제 요청은 알 수 없습니다. 최근 한 건과 다음 행동을 적으면 아래 복사본에 함께 들어갑니다. 입력은 이 브라우저에만 있고 새로고침하면 사라집니다.</p>
        <label>다시 돌아온 요청 한 건<input id="record-case" maxlength="120" placeholder="예: 예약 변경 문의가 교대 뒤 다시 들어옴" autocomplete="off"></label>
        <label>누가 무엇을 언제까지 확인하나요?<input id="record-action" maxlength="120" placeholder="예: 다음 근무자가 변경 가능 시간 확인 후 손님에게 회신" autocomplete="off"></label>
        <label>7일 뒤 무엇을 다시 볼까요?<input id="record-review" maxlength="120" placeholder="예: 같은 문의가 다시 대표에게 온 횟수" autocomplete="off"></label>
      </div>
      <details class="compare-box why-box"><summary>왜 이 주제가 나왔나요?</summary><p>${selectionBasis(a)}</p></details>
      <div class="compare-box"><strong>함께 확인할 사람</strong><br>운영자가 답한 내용만으로 직원이 실제로 어디까지 안내할 수 있는지는 알 수 없습니다. 정한 문장을 직원과 확인하고, 승인할 예외와 책임자를 먼저 정하세요.</div>
      ${nextBox}
      <div class="cat-block"><h3>내가 고른 12개 답</h3>${rows}</div>
      <div class="result-actions">
        <button class="primary" onclick="copyResult()">7일 카드와 답변 복사하기</button>
        <a class="feedback-link" href="/feedback.html?area=industry&point=result" target="_blank" rel="noopener noreferrer">7일 카드가 쓸모 있었는지 의견 남기기 →</a>
        <button class="secondary" onclick="renderIntro()">처음부터 다시 하기</button>
        <a class="home-link" href="/industry.html">가게 점검 설명으로 돌아가기</a>
      </div>
    </div>
  `;
  focusScreen();
}

function copyResult(){
  const a = analyze();
  const card = a.allBest ? STEADY_CARD : MANUALS[a.focus];
  const recorded = id => document.getElementById(id).value.trim() || '아직 적지 않음';
  const lines = ['[디테일랩 · 우리 가게 인수인계 점검]','',`주제 선정 근거: ${selectionBasis(a)}`,'확인할 사람: 운영자가 승인할 예외를 정하고 교대 직원과 실제 사용할 문장을 확인하세요.','',`7일 동안 먼저 볼 것: ${card.h}`,...card.items.map((item,i)=>`${i+1}. ${item}`),'','우리 가게에서 직접 적은 한 건',`다시 돌아온 요청: ${recorded('record-case')}`,`누가 무엇을 언제까지: ${recorded('record-action')}`,`7일 뒤 확인할 것: ${recorded('record-review')}`,'','7일 뒤 실제 사용 의견: https://detail-lab-site.onrender.com/feedback.html?area=industry&point=later','','내가 고른 답', ...QUESTIONS.map((q,i)=>`${q.text}\n→ ${state.texts[i]||''}`)];
  copyText(lines.join('\n'), '결과가 복사되었습니다');
}

renderIntro();
</script>
