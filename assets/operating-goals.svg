<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc"><title id="title">함께 정할 운영 목표</title><desc id="desc">대표에게 몰리는 결정을 나누고, 고객 안내와 실제 제공을 맞추며, 담당이 바뀌어도 일이 이어지는 모습을 목표로 삼는다.</desc>
<rect width="1180" height="360" fill="#f6f4ee"/>
<g fill="#edf0e7" stroke="#d4dcca"><rect x="0.5" y="0.5" width="373" height="359"/><rect x="403.5" y="0.5" width="373" height="359"/><rect x="806.5" y="0.5" width="373" height="359"/></g>
<g fill="none" stroke="#547347" stroke-width="2"><circle cx="55" cy="73" r="25"/><path d="M55 56V74L69 83"/><path d="M438 48H486V82H460L450 92V82H438Z"/><path d="M448 59H477M448 70H469"/><rect x="839" y="48" width="47" height="47"/><path d="M849 62L856 68L869 55M849 80H875"/></g>
<g font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#254e41"><text x="31" y="154" font-size="15" fill="#7e6944">대표의 시간</text><text x="31" y="204" font-size="29">결정이 한 사람에게만</text><text x="31" y="246" font-size="29">모이지 않도록.</text><text x="31" y="309" font-size="15" fill="#58675f">처리 범위와 승인할 예외를 분명하게</text>
<text x="434" y="154" font-size="15" fill="#7e6944">고객의 이해</text><text x="434" y="204" font-size="29">안내와 실제 서비스가</text><text x="434" y="246" font-size="29">서로 맞도록.</text><text x="434" y="309" font-size="15" fill="#58675f">기대한 내용과 제공하는 조건을 함께</text>
<text x="837" y="154" font-size="15" fill="#7e6944">업무의 연속성</text><text x="837" y="204" font-size="29">담당이 바뀌어도</text><text x="837" y="246" font-size="29">일이 이어지도록.</text><text x="837" y="309" font-size="15" fill="#58675f">남은 약속과 다음 담당을 같은 기록에</text></g></svg>
