<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc"><title id="title">함께 정할 운영 목표</title><desc id="desc">판단할 근거를 정리하고 미뤄둔 생각을 실행하며 사업의 좋은 점을 고객에게 전하는 목표 예시.</desc>
<rect width="1180" height="360" fill="#f6f4ee"/>
<g fill="#edf0e7" stroke="#d4dcca"><rect x="0.5" y="0.5" width="373" height="359"/><rect x="403.5" y="0.5" width="373" height="359"/><rect x="806.5" y="0.5" width="373" height="359"/></g>
<g fill="none" stroke="#547347" stroke-width="2"><circle cx="55" cy="73" r="25"/><path d="M55 56V74L69 83"/><path d="M438 48H486V82H460L450 92V82H438Z"/><path d="M448 59H477M448 70H469"/><rect x="839" y="48" width="47" height="47"/><path d="M849 62L856 68L869 55M849 80H875"/></g>
<g font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#254e41"><text x="31" y="154" font-size="15" fill="#7e6944">판단의 여유</text><text x="31" y="204" font-size="29">흩어진 생각을</text><text x="31" y="246" font-size="29">선택할 근거로.</text><text x="31" y="309" font-size="14" fill="#58675f">자료와 다른 가능성을 나란히 살피기</text>
<text x="434" y="154" font-size="15" fill="#7e6944">실행의 진척</text><text x="434" y="204" font-size="29">미뤄둔 아이디어를</text><text x="434" y="246" font-size="29">쓸 수 있는 모습으로.</text><text x="434" y="309" font-size="14" fill="#58675f">다음 행동과 맡을 일을 구체적으로</text>
<text x="837" y="154" font-size="15" fill="#7e6944">사업의 색깔</text><text x="837" y="204" font-size="29">우리 사업의 좋은 점을</text><text x="837" y="246" font-size="29">고객이 알 수 있게.</text><text x="837" y="309" font-size="14" fill="#58675f">공들이는 과정과 실제 가치를 분명하게</text></g></svg>
