<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 960" role="img" aria-labelledby="title desc"><title id="title">함께 정할 운영 목표</title><desc id="desc">판단의 여유, 실행의 진척, 사업의 색깔이라는 세 가지 목표 예시.</desc><rect width="620" height="960" fill="#f6f4ee"/><g fill="#edf0e7" stroke="#d4dcca"><rect x="1" y="1" width="618" height="298"/><rect x="1" y="331" width="618" height="298"/><rect x="1" y="661" width="618" height="298"/></g>
<g font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#254e41"><text x="40" y="61" font-size="23" fill="#7e6944">판단의 여유</text><text x="40" y="128" font-size="36">흩어진 생각을</text><text x="40" y="179" font-size="36">선택할 근거로.</text><text x="40" y="252" font-size="23" fill="#58675f">자료와 다른 가능성을 나란히 살피기</text>
<text x="40" y="391" font-size="23" fill="#7e6944">실행의 진척</text><text x="40" y="458" font-size="36">미뤄둔 아이디어를</text><text x="40" y="509" font-size="36">쓸 수 있는 모습으로.</text><text x="40" y="582" font-size="23" fill="#58675f">다음 행동과 맡을 일을 구체적으로</text>
<text x="40" y="721" font-size="23" fill="#7e6944">사업의 색깔</text><text x="40" y="788" font-size="36">우리 사업의 좋은 점을</text><text x="40" y="839" font-size="36">고객이 알 수 있게.</text><text x="40" y="912" font-size="23" fill="#58675f">공들이는 과정과 실제 가치를 분명하게</text></g></svg>
