<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 960" role="img" aria-labelledby="title desc"><title id="title">함께 정할 운영 목표</title><desc id="desc">대표의 시간, 고객의 이해, 업무의 연속성이라는 세 가지 목표 예시.</desc><rect width="620" height="960" fill="#f6f4ee"/><g fill="#edf0e7" stroke="#d4dcca"><rect x="1" y="1" width="618" height="298"/><rect x="1" y="331" width="618" height="298"/><rect x="1" y="661" width="618" height="298"/></g>
<g font-family="Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#254e41"><text x="40" y="61" font-size="23" fill="#7e6944">대표의 시간</text><text x="40" y="128" font-size="36">결정이 한 사람에게만</text><text x="40" y="179" font-size="36">모이지 않도록.</text><text x="40" y="252" font-size="23" fill="#58675f">처리 범위와 승인할 예외를 분명하게</text>
<text x="40" y="391" font-size="23" fill="#7e6944">고객의 이해</text><text x="40" y="458" font-size="36">안내와 실제 서비스가</text><text x="40" y="509" font-size="36">서로 맞도록.</text><text x="40" y="582" font-size="23" fill="#58675f">기대한 내용과 제공하는 조건을 함께</text>
<text x="40" y="721" font-size="23" fill="#7e6944">업무의 연속성</text><text x="40" y="788" font-size="36">담당이 바뀌어도</text><text x="40" y="839" font-size="36">일이 이어지도록.</text><text x="40" y="912" font-size="23" fill="#58675f">남은 약속과 다음 담당을 같은 기록에</text></g></svg>
