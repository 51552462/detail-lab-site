name: Claude follow-up after site check

on:
  workflow_run:
    workflows: [Detail Lab static site check]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: claude-followup-main
  cancel-in-progress: false

jobs:
  fire:
    # The owner is currently working with ChatGPT alone. Keep the integration
    # in source history, but do not fire an external Claude routine on release.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trigger existing Claude routine for the latest non-Claude main change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/fire_claude_routine.py
